<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Умный садовод</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&family=Neucha&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #F7F3EC;
      --text: #2C2C2C;

      --card: #FFF9EE;
      --card-green: #EAF5DF;
      --card-beige: #F6EFDD;

      --shadow: 0 10px 20px rgba(70, 60, 40, 0.12);
      --shadow-hover: 0 16px 28px rgba(70, 60, 40, 0.18);

      --radius-card: 16px;
      --radius-big: 24px;
      --radius-huge: 30px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: 0.2px;
    }

    body.ui-hidden {
      overflow: hidden;
    }

    h1,
    h2,
    h3,
    h4,
    .section-title {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.3;
      margin: 0 0 10px;
    }

    .app-title {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.2;
      letter-spacing: 0.3px;
      margin: 0;
      color: #2F4C33;
    }

    /* ============================== */
    /* Кнопки: только вдавливание,    */
    /* без пружинки и ряби            */
    /* ============================== */

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 15px;
      text-transform: none;
      padding: 10px 16px;
      border: none;
      border-radius: 18px;
      color: var(--text);
      background: linear-gradient(180deg, #FFF3D6, #FFE7B8);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: var(--shadow-hover);
      filter: saturate(1.05);
    }

    button:active {
      transform: translateY(2px) scale(0.96);
      box-shadow: 0 4px 10px rgba(70, 60, 40, 0.15);
      filter: saturate(1.1);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(133, 208, 124, 0.5);
      outline-offset: 2px;
    }

    #saveBtn {
      background: linear-gradient(180deg, #D8F1FF, #BFE3FF);
    }

    #loadBtn {
      background: linear-gradient(180deg, #DFF8E6, #C4EDD4);
    }

    #resetBtn {
      background: linear-gradient(180deg, #FFE1EC, #FFC7DE);
    }

    #generateBtn {
      background: linear-gradient(180deg, #C9F3B9, #A9E8A0);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 14px;
      font-size: 18px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #FFF7E8, #F6EBD2);
    }

    /* ============================== */
    /* Шапка: заголовок первой        */
    /* строкой, меню и кнопки ниже    */
    /* ============================== */

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 249, 238, 0.94);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 18px rgba(70, 60, 40, 0.08);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    @media (min-width: 1024px) {
      .toolbar-row {
        flex-wrap: nowrap;
      }
    }

    .toolbar label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #4B4B4B;
      white-space: nowrap;
    }

    .toolbar input,
    .toolbar select {
      width: 92px;
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 15px;
    }

    .toolbar-buttons {
      margin-left: auto;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
    }

    /* Поля ввода */

    input,
    select {
      font-family: "Inter", Arial, sans-serif;
      font-size: 15px;
      color: var(--text);
      padding: 10px 12px;
      border: none;
      border-radius: 14px;
      background: #FFFDF7;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        0 6px 14px rgba(70, 60, 40, 0.08);
    }

    /* ============================== */
    /* Блок подсказок с 4 шагами      */
    /* ============================== */

    #hintBar {
      position: relative;
      z-index: 5;
      margin: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border-radius: var(--radius-big);
      box-shadow: var(--shadow);
    }

    .hint-content {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hint-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: help;
    }

    .hint-pill:hover {
      z-index: 60;
    }

    .hint-step-number {
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: linear-gradient(180deg, #FFE4A8, #F5D186);
      color: #5C451F;
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 12px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 3px 8px rgba(70, 60, 40, 0.10);
    }

    .hint-pill::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 10px);
      bottom: auto;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      background: rgba(255, 253, 247, 0.96);
      color: #4B4B4B;
      border: 1px solid rgba(121, 96, 62, 0.14);
      box-shadow: 0 12px 22px rgba(70, 60, 40, 0.16);

      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      text-align: center;

      padding: 7px 10px;
      border-radius: 10px;

      width: max-content;
      max-width: 240px;
      white-space: normal;

      transition:
        opacity 0.16s ease,
        transform 0.16s ease,
        visibility 0.16s ease;

      z-index: 80;
    }

    .hint-pill::before {
      content: "";
      position: absolute;
      top: calc(100% + 4px);
      bottom: auto;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);

      width: 0;
      height: 0;

      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 0;
      border-bottom: 6px solid rgba(255, 253, 247, 0.96);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.16s ease,
        transform 0.16s ease,
        visibility 0.16s ease;

      z-index: 80;
    }

    .hint-pill:hover::after,
    .hint-pill:hover::before {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Раскладка */

    .layout {
      display: grid;
      gap: 16px;
      padding: 0 16px 16px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 1024px) {
      .layout {
        grid-template-columns: 300px minmax(0, 1fr) 360px;
        height: calc(100vh - 220px);
      }
    }

    .side {
      background: var(--card);
      border-radius: var(--radius-big);
      box-shadow: var(--shadow);
      padding: 16px;
      overflow: auto;
    }

    .palette-buttons {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .add-object {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      border-radius: var(--radius-card);
      background: linear-gradient(180deg, #FDF7E7, #F1F7DF);
      font-size: 16px;
    }

    .object-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      border-radius: var(--radius-card);
      background: linear-gradient(180deg, #FFF9EE, #F4F6DF);
      font-size: 14px;
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 600;
    }

    .list-item.selected {
      background: linear-gradient(180deg, #EFFFF4, #DFF8E3);
      box-shadow:
        0 0 0 3px rgba(134, 214, 151, 0.35),
        var(--shadow);
    }

    .list-item::before {
      font-size: 16px;
      line-height: 1;
    }

    .list-item[data-type="building"]::before {
      content: "🏠";
    }

    .list-item[data-type="greenhouse"]::before {
      content: "🌱";
    }

    .list-item[data-type="bed"]::before {
      content: "🥕";
    }

    .list-item[data-type="tree"]::before {
      content: "🌳";
    }

    .list-item[data-type="bush"]::before {
      content: "🌵";
    }

    /* Холст */

    .canvas-wrap {
      position: relative;
      border-radius: var(--radius-huge);
      box-shadow: var(--shadow);
      padding: 16px;
      overflow: auto;
      min-height: 380px;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.2)),
        linear-gradient(135deg, #F5FBEC, #EDF7DD);
    }

    .canvas {
      position: relative;
      margin: auto;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow:
        inset 0 0 0 1px rgba(120, 160, 120, 0.08),
        0 14px 28px rgba(70, 60, 40, 0.08);
      touch-action: none;
      background-image:
        linear-gradient(to right, rgba(70, 110, 80, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(70, 110, 80, 0.06) 1px, transparent 1px);
    }

    /* Объекты на схеме */

    .object {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      border: 2px solid rgba(0, 0, 0, 0.12);
      background: #FFFFFF;
      box-shadow: 0 8px 16px rgba(70, 60, 40, 0.12);
      border-radius: 18px;
      line-height: 1;
      color: #2C2C2C;
      font-family:
        "Inter",
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
      user-select: none;
      touch-action: none;
      cursor: grab;
      animation: stickerPop 0.28s ease;
      transition:
        transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.18s ease,
        background-color 0.18s ease,
        border-color 0.18s ease;
    }

    .object:hover {
      transform: translateY(-4px) scale(1.07);
      box-shadow: 0 12px 22px rgba(70, 60, 40, 0.18);
    }

    .object:active {
      cursor: grabbing;
      transform: scale(0.98);
    }

    .object[data-type="building"] {
      background: linear-gradient(180deg, #FFF7EF, #F9E8D4);
      border-color: #D9B48F;
    }

    .object[data-type="greenhouse"] {
      background: linear-gradient(180deg, #F3FFF5, #DCF2E0);
      border-color: #9CCFA8;
    }

    .object[data-type="bed"] {
      background: linear-gradient(180deg, #F9FFE9, #E5F7CF);
      border-color: #B0D37E;
    }

    .object[data-type="tree"] {
      background: linear-gradient(180deg, #F0FFFB, #D9F0EC);
      border-color: #96C9C1;
    }

    .object[data-type="bush"] {
      background: linear-gradient(180deg, #FFF9EC, #FDECCB);
      border-color: #E2BE88;
    }

    .object.selected {
      box-shadow:
        0 0 0 3px rgba(84, 190, 116, 0.30),
        0 10px 18px rgba(70, 60, 40, 0.16);
    }

    .object.invalid {
      border-color: #F07281;
      background: rgba(255, 59, 48, 0.10);
    }

    /* Панель настроек */

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .panel-header .section-title {
      margin: 0;
    }

    .properties-body {
      font-size: 15px;
    }

    .prop-type {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #6B805C;
      margin-bottom: 8px;
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0;
    }

    .prop-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: #5C5C5C;
      margin-bottom: 10px;
    }

    .properties-body input,
    .properties-body select {
      width: 100%;
      font-size: 15px;
    }

    .bed-box {
      border-radius: var(--radius-card);
      background: #F3FAE9;
      padding: 10px;
      margin: 10px 0;
      box-shadow: var(--shadow);
    }

    .bed-box legend {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #3E7C4F;
      padding: 0 4px;
    }

    .btn-danger {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(180deg, #FFE1EC, #FFC7DE);
    }

    /* Статус */

    .status {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 5;
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(44, 44, 44, 0.82);
      color: white;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      box-shadow: var(--shadow);
    }

    .status.visible {
      opacity: 1;
    }

    .muted {
      border-radius: var(--radius-card);
      background: #FFF8EC;
      padding: 10px;
      color: #7A6C54;
      font-size: 14px;
      box-shadow: var(--shadow);
    }

    /* Кнопка мобильного режима */

    .ui-toggle-btn {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 70;
      padding: 12px 16px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #C9F3B9, #A9E8A0);
      box-shadow: 0 14px 26px rgba(70, 60, 40, 0.2);
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 14px;
    }

    .ui-toggle-btn:hover {
      transform: translateY(-3px) scale(1.03);
    }

    /* Скрытый режим */

    body.ui-hidden .toolbar,
    body.ui-hidden #hintBar,
    body.ui-hidden .palette,
    body.ui-hidden .panel {
      display: none;
    }

    body.ui-hidden .layout {
      display: block;
      padding: 0;
      height: 100vh;
      height: 100dvh;
    }

    body.ui-hidden .canvas-wrap {
      position: fixed;
      inset: 0;
      border-radius: 0;
      padding: 8px;
      min-height: 100vh;
      min-height: 100dvh;
      z-index: 10;
    }

    /* ============================== */
    /* Окно «Календарь» с рисунком    */
    /* ============================== */

    .calendar-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(40, 35, 25, 0.45);
      backdrop-filter: blur(3px);
    }

    .calendar-modal[hidden] {
      display: none;
    }

    .calendar-stage {
      position: relative;
      width: min(96vw, calc(92vh * 1.75));
      aspect-ratio: 1792 / 1024;
    }

    .calendar-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .calendar-stage.no-image {
      background:
        linear-gradient(to right, rgba(70, 110, 80, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(70, 110, 80, 0.08) 1px, transparent 1px),
        #FFFDF6;
      background-size: 40px 40px, 40px 40px, auto;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .calendar-stage.no-image img {
      display: none;
    }

    /* Текст задач на чистом листе */
    .calendar-text {
      position: absolute;
      left: 33%;
      top: 17%;
      width: 37%;
      height: 46%;
      overflow: hidden;
      padding: 1.5% 2.5%;
      font-family: "Neucha", "Inter", sans-serif;
      font-size: clamp(10px, 1.5vw, 17px);
      line-height: 1.4;
      color: #3B332A;
    }

    .cal-row {
      margin-bottom: 0.4em;
    }

    .cal-date {
      font-weight: 700;
      color: #2F4C33;
    }

    /* Невидимые кнопки поверх нарисованных */
    .cal-btn {
      position: absolute;
      width: 8.4%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      background: transparent;
      box-shadow: none;
      padding: 0;
      cursor: pointer;
    }

    .cal-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .cal-btn-down  { left: 35.5%; top: 69.5%; }
    .cal-btn-up    { left: 46.8%; top: 69.5%; }
    .cal-btn-close { left: 58.1%; top: 69.5%; }

    /* Анимации */

    @keyframes stickerPop {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(4px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Мобильная адаптация */

    @media (max-width: 1023px) {
      .toolbar {
        padding: 10px 12px;
        gap: 8px;
      }

      .toolbar label {
        font-size: 12px;
      }

      .toolbar input,
      .toolbar select {
        width: 76px;
        padding: 8px 10px;
      }

      .toolbar-buttons {
        width: 100%;
        margin-left: 0;
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .canvas-wrap {
        min-height: 55vh;
      }

      #hintBar {
        margin: 12px;
        padding: 12px;
      }

      .layout {
        padding: 0 12px 12px;
        gap: 12px;
      }

      .hint-pill::after {
        max-width: 180px;
      }
    }

    /* ============================== */
    /* Чат-бот                        */
    /* ============================== */

    .sg-chat-toggle {
      position: fixed;
      right: 14px;
      bottom: 78px;
      z-index: 80;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #C9F3B9, #A9E8A0);
      box-shadow: 0 14px 26px rgba(70, 60, 40, 0.20);
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #274A22;
      cursor: pointer;
      transition:
        transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.18s ease;
    }

    .sg-chat-toggle:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 18px 32px rgba(70, 60, 40, 0.24);
    }

    .sg-chat-panel {
      position: fixed;
      right: 14px;
      bottom: 132px;
      width: min(400px, calc(100vw - 28px));
      height: min(560px, calc(100vh - 190px));
      z-index: 85;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: var(--radius-big);
      background: var(--card);
      box-shadow: var(--shadow-hover);
    }

    .sg-chat-panel[hidden] {
      display: none;
    }

    .sg-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(234, 245, 223, 0.92), rgba(246, 239, 221, 0.92));
      border-bottom: 1px solid rgba(90, 100, 70, 0.12);
    }

    .sg-chat-header strong {
      font-family: "Montserrat", "Inter", sans-serif;
      font-size: 16px;
      color: #274A22;
    }

    .sg-chat-header-actions {
      display: flex;
      gap: 6px;
    }

    .sg-chat-icon-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 12px;
      background: #FFFFFF;
      box-shadow: 0 6px 14px rgba(70, 60, 40, 0.12);
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .sg-chat-icon-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 18px rgba(70, 60, 40, 0.16);
    }

    .sg-chat-messages {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.42)),
        var(--bg);
    }

    .sg-chat-msg {
      max-width: 92%;
      padding: 9px 11px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.45;
      box-shadow: 0 6px 14px rgba(70, 60, 40, 0.08);
      animation: sgChatPop 0.22s ease;
    }

    .sg-chat-msg.bot {
      align-self: flex-start;
      background: #F5F8EC;
      border: 1px solid rgba(120, 140, 90, 0.14);
    }

    .sg-chat-msg.user {
      align-self: flex-end;
      background: #E9F4FF;
      border: 1px solid rgba(70, 130, 180, 0.14);
    }

    .sg-chat-quick {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid rgba(90, 100, 70, 0.12);
      background: #FFFDF6;
    }

    .sg-chat-quick button,
    .sg-chat-chip {
      border: none;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      background: linear-gradient(180deg, #FFF6DF, #F8EBC8);
      color: #4A3B19;
      box-shadow: 0 6px 12px rgba(70, 60, 40, 0.10);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .sg-chat-quick button:hover,
    .sg-chat-chip:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 9px 16px rgba(70, 60, 40, 0.14);
    }

    .sg-chat-input-row {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid rgba(90, 100, 70, 0.12);
      background: #FFFDF6;
    }

    .sg-chat-input-row input {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 10px 12px;
      background: #FFFFFF;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 5px 12px rgba(70, 60, 40, 0.07);
      font-size: 14px;
    }

    .sg-chat-input-row button {
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      background: linear-gradient(180deg, #C2EBA8, #99D77F);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .sg-chat-input-row button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(70, 60, 40, 0.14);
    }

    .sg-chat-plant-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    @keyframes sgChatPop {
      from {
        opacity: 0;
        transform: translateY(5px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 700px) {
      .sg-chat-toggle {
        bottom: 74px;
      }

      .sg-chat-panel {
        bottom: 128px;
        height: min(58vh, 520px);
      }
    }
  </style>
</head>

<body>

  <header class="toolbar">
    <h1 class="app-title">🌱 Умный садовод</h1>

    <div class="toolbar-row">
      <label>
        Ширина, м
        <input id="plotWidth" type="number" min="1" max="500" step="0.5" />
      </label>

      <label>
        Длина, м
        <input id="plotLength" type="number" min="1" max="500" step="0.5" />
      </label>

      <label>
        Сетка, м
        <select id="gridStep">
          <option value="0.1">0.1</option>
          <option value="0.25">0.25</option>
          <option value="0.5" selected>0.5</option>
          <option value="1">1</option>
        </select>
      </label>

      <div class="toolbar-buttons">
        <button type="button" id="saveBtn">💾 Сохранить</button>
        <button type="button" id="loadBtn">📂 Загрузить</button>
        <button type="button" id="resetBtn">🧹 Сбросить</button>
        <button type="button" id="generateBtn">🗓 Календарь</button>
      </div>
    </div>
  </header>

  <div id="hintBar">
    <div class="hint-content">
      <button
        type="button"
        class="hint-pill"
        data-tip="Шаг 1 из 4: добавьте объект на участок"
        aria-label="Шаг 1 из 4: добавьте объект на участок"
      >
        <span class="hint-step-number">1</span>
        <span>🌿 Добавьте объект</span>
      </button>

      <button
        type="button"
        class="hint-pill"
        data-tip="Шаг 2 из 4: перетащите объект на участок"
        aria-label="Шаг 2 из 4: перетащите объект на участок"
      >
        <span class="hint-step-number">2</span>
        <span>🖐 Перетащите его на участок</span>
      </button>

      <button
        type="button"
        class="hint-pill"
        data-tip="Шаг 3 из 4: кликните по объекту, чтобы настроить его параметры"
        aria-label="Шаг 3 из 4: кликните по объекту, чтобы настроить его параметры"
      >
        <span class="hint-step-number">3</span>
        <span>⚙️ Кликните, чтобы настроить</span>
      </button>

      <button
        type="button"
        class="hint-pill"
        data-tip="Шаг 4 из 4: сохраните план в файл"
        aria-label="Шаг 4 из 4: сохраните план в файл"
      >
        <span class="hint-step-number">4</span>
        <span>💾 Сохраните план в файл</span>
      </button>
    </div>

    <button type="button" id="closeHintBtn" class="icon-btn" title="Скрыть подсказки">
      ✕
    </button>
  </div>

  <main class="layout">

    <aside class="side palette">
      <h2 class="section-title">Добавить объект</h2>

      <div class="palette-buttons">
        <button type="button" class="add-object" data-type="building">🏠 Постройка</button>
        <button type="button" class="add-object" data-type="greenhouse">🌱 Теплица</button>
        <button type="button" class="add-object" data-type="bed">🥕 Грядка</button>
        <button type="button" class="add-object" data-type="tree">🌳 Дерево</button>
        <button type="button" class="add-object" data-type="bush">🌵 Кустарник</button>
      </div>

      <h2 class="section-title">Объекты</h2>
      <div id="objectList" class="object-list"></div>
    </aside>

    <section id="canvasWrap" class="canvas-wrap">
      <div id="canvas" class="canvas"></div>
      <div id="status" class="status"></div>
    </section>

    <aside id="panel" class="side panel">
      <div class="panel-header">
        <h2 class="section-title">Настройки объекта</h2>
        <button type="button" id="closePanelBtn" class="icon-btn" title="Закрыть панель">✕</button>
      </div>

      <div id="propertiesBody">
        Выберите объект на схеме или в списке.
      </div>
    </aside>

  </main>

  <input
    type="file"
    id="fileInput"
    accept=".json,application/json"
    hidden
  />

  <button type="button" id="uiToggleBtn" class="ui-toggle-btn">
    🙈 Скрыть параметры
  </button>

  <!-- ============================== -->
  <!-- Окно «Календарь» с рисунком    -->
  <!-- ============================== -->

  <div id="calendarModal" class="calendar-modal" hidden>
    <div class="calendar-stage" id="calendarStage">
      <img id="calendarBg" src="calendar-bg.png" alt="" />

      <div id="calendarText" class="calendar-text"></div>

      <button type="button" id="btnCalDown" class="cal-btn cal-btn-down" aria-label="Прокрутить вниз"></button>
      <button type="button" id="btnCalUp" class="cal-btn cal-btn-up" aria-label="Прокрутить вверх"></button>
      <button type="button" id="btnCalClose" class="cal-btn cal-btn-close" aria-label="Закрыть календарь"></button>
    </div>
  </div>

  <!-- ============================== -->
  <!-- Чат-бот                        -->
  <!-- ============================== -->

  <button id="sgChatToggle" class="sg-chat-toggle" type="button">
    🤖 Советчик
  </button>

  <section id="sgChatPanel" class="sg-chat-panel" hidden>
    <div class="sg-chat-header">
      <strong>🌱 Советчик садовода</strong>

      <div class="sg-chat-header-actions">
        <button id="sgChatLoadBtn" class="sg-chat-icon-btn" type="button" title="Загрузить plants.json">
          📂
        </button>
        <button id="sgChatCloseBtn" class="sg-chat-icon-btn" type="button" title="Закрыть чат">
          ✕
        </button>
      </div>
    </div>

    <div id="sgChatMessages" class="sg-chat-messages"></div>
    <div id="sgChatQuick" class="sg-chat-quick"></div>

    <div class="sg-chat-input-row">
      <input
        id="sgChatInput"
        type="text"
        placeholder="Например: яблоня, укроп, виноград"
      />
      <button id="sgChatSendBtn" type="button">➤</button>
    </div>

    <input
      id="sgChatFileInput"
      type="file"
      accept=".json,application/json"
      hidden
    />
  </section>

  <script>
    (function () {
      'use strict';

      const TYPE_LABELS = {
        building: 'Постройка',
        greenhouse: 'Теплица',
        bed: 'Грядка',
        tree: 'Дерево',
        bush: 'Кустарник'
      };

      const TYPE_EMOJI = {
        building: '🏠',
        greenhouse: '🌱',
        bed: '🥕',
        tree: '🌳',
        bush: '🌵'
      };

      const CROPS = [
        'Томат',
        'Огурец',
        'Перец',
        'Салат',
        'Клубника',
        'Укроп',
        'Петрушка',
        'Лук',
        'Чеснок',
        'Морковь',
        'Редис',
        'Кабачок',
        'Тыква'
      ];

      const TREE_CULTURES = [
        'Яблоня',
        'Груша',
        'Слива',
        'Вишня',
        'Черешня'
      ];

      const BUSH_CULTURES = [
        'Смородина',
        'Малина',
        'Крыжовник',
        'Ежевика',
        'Жимолость',
        'Виноград'
      ];

      let state = {
        plot: {
          widthM: 12,
          lengthM: 8,
          gridStepM: 0.5
        },
        objects: []
      };

      let els = null;
      let selectedId = null;
      let pxPerMeter = 30;
      let dragContext = null;
      let fileHandle = null;

      function ready(callback) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', callback);
        } else {
          callback();
        }
      }

      ready(function () {
        initApp();
        initChat();
        initCalendarModal();
      });

      /* ============================== */
      /* Основной редактор              */
      /* ============================== */

      function initApp() {
        els = {
          plotWidth: document.getElementById('plotWidth'),
          plotLength: document.getElementById('plotLength'),
          gridStep: document.getElementById('gridStep'),
          saveBtn: document.getElementById('saveBtn'),
          loadBtn: document.getElementById('loadBtn'),
          resetBtn: document.getElementById('resetBtn'),
          generateBtn: document.getElementById('generateBtn'),
          canvasWrap: document.getElementById('canvasWrap'),
          canvas: document.getElementById('canvas'),
          status: document.getElementById('status'),
          objectList: document.getElementById('objectList'),
          panel: document.getElementById('panel'),
          closePanelBtn: document.getElementById('closePanelBtn'),
          propertiesBody: document.getElementById('propertiesBody'),
          fileInput: document.getElementById('fileInput'),
          hintBar: document.getElementById('hintBar'),
          closeHintBtn: document.getElementById('closeHintBtn'),
          uiToggleBtn: document.getElementById('uiToggleBtn')
        };

        const missing = Object.entries(els)
          .filter(([key, value]) => !value)
          .map(([key]) => key);

        if (missing.length) {
          console.error('Умный садовод: не найдены элементы с id:', missing.join(', '));
          return;
        }

        syncPlotInputs();
        bindAppEvents();
        renderAll();

        console.info('Умный садовод: основной интерфейс инициализирован.');
      }

      function bindAppEvents() {
        on(els.plotWidth, 'change', () => {
          state.plot.widthM = clamp(Number(els.plotWidth.value) || 12, 1, 500);
          clampAllObjects();
          renderAll();
        });

        on(els.plotLength, 'change', () => {
          state.plot.lengthM = clamp(Number(els.plotLength.value) || 8, 1, 500);
          clampAllObjects();
          renderAll();
        });

        on(els.gridStep, 'change', () => {
          state.plot.gridStepM = Number(els.gridStep.value) || 0.5;
          renderAll();
        });

        document.querySelectorAll('.add-object').forEach(button => {
          on(button, 'click', () => {
            createObject(button.dataset.type);
          });
        });

        on(els.saveBtn, 'click', savePlanToFile);
        on(els.loadBtn, 'click', loadPlanFromFile);

        on(els.resetBtn, 'click', () => {
          if (!confirm('Очистить текущий план?')) return;

          state.objects = [];
          selectedId = null;
          fileHandle = null;

          renderAll();
          showTemporaryStatus('План очищен. Нажмите «Загрузить», чтобы открыть файл.');
        });

        on(els.generateBtn, 'click', openCalendarModal);

        on(els.fileInput, 'change', async () => {
          const file = els.fileInput.files && els.fileInput.files[0];

          if (!file) return;

          await applyPlanFile(file);

          els.fileInput.value = '';
        });

        on(els.closePanelBtn, 'click', () => {
          selectedId = null;
          renderAll();
        });

        on(els.closeHintBtn, 'click', () => {
          if (els.hintBar) {
            els.hintBar.remove();
          }
        });

        document.querySelectorAll('.hint-pill').forEach(button => {
          on(button, 'click', () => {
            button.blur();
          });
        });

        on(els.uiToggleBtn, 'click', () => {
          const hidden = document.body.classList.toggle('ui-hidden');

          els.uiToggleBtn.textContent = hidden
            ? '⚙️ Показать параметры'
            : '🙈 Скрыть параметры';

          requestAnimationFrame(renderCanvas);
        });

        on(els.canvas, 'pointerdown', (event) => {
          if (event.target === els.canvas) {
            selectedId = null;
            renderProperties();
            renderObjectList();
            updateSelectionClasses();
          }
        });

        window.addEventListener('resize', renderCanvas);
      }

      function createObject(type) {
        if (!TYPE_LABELS[type]) {
          console.warn('Неизвестный тип объекта:', type);
          return null;
        }

        const defaults = {
          building: { w: 3, l: 4 },
          greenhouse: { w: 3, l: 6 },
          bed: { w: 1, l: 3 },
          tree: { w: 2, l: 2 },
          bush: { w: 1, l: 1 }
        };

        const count = state.objects.filter(o => o.type === type).length + 1;

        const obj = {
          id: makeId(),
          type,
          name: `${TYPE_LABELS[type]} ${count}`,
          xM: 0,
          yM: 0,
          widthM: Math.min(defaults[type].w, state.plot.widthM),
          lengthM: Math.min(defaults[type].l, state.plot.lengthM),
          rotation: 0
        };

        if (type === 'bed') {
          obj.culture = null;
          obj.plantingDate = null;
        }

        if (type === 'tree' || type === 'bush') {
          obj.culture = null;
        }

        if (type === 'greenhouse') {
          obj.greenhouseBedCount = 2;
          obj.greenhouseBedCultures = [null, null];
          obj.greenhouseBedPlantingDates = [null, null];
        }

        findFreeSpot(obj);

        state.objects.push(obj);
        selectedId = obj.id;

        renderAll();

        return obj;
      }

      function findFreeSpot(obj) {
        const searchStep = Math.max(state.plot.gridStepM, 0.5);

        const maxX = Math.max(0, state.plot.widthM - obj.widthM);
        const maxY = Math.max(0, state.plot.lengthM - obj.lengthM);

        for (let y = 0; y <= maxY + 0.001; y += searchStep) {
          for (let x = 0; x <= maxX + 0.001; x += searchStep) {
            obj.xM = Number(x.toFixed(2));
            obj.yM = Number(y.toFixed(2));

            if (isPlacementValid(obj)) {
              return;
            }
          }
        }

        obj.xM = 0;
        obj.yM = 0;
      }

      function renderAll() {
        syncPlotInputs();
        renderCanvas();
        renderObjectList();
        renderProperties();
      }

      function syncPlotInputs() {
        if (!els) return;

        els.plotWidth.value = state.plot.widthM;
        els.plotLength.value = state.plot.lengthM;
        els.gridStep.value = String(state.plot.gridStepM);
      }

      function renderCanvas() {
        if (!els || !els.canvasWrap || !els.canvas) return;

        const availableWidth = Math.max(80, els.canvasWrap.clientWidth - 32);
        const availableHeight = Math.max(80, els.canvasWrap.clientHeight - 32);

        pxPerMeter = Math.max(
          12,
          Math.min(
            availableWidth / state.plot.widthM,
            availableHeight / state.plot.lengthM
          )
        );

        const widthPx = state.plot.widthM * pxPerMeter;
        const heightPx = state.plot.lengthM * pxPerMeter;

        els.canvas.style.width = `${widthPx}px`;
        els.canvas.style.height = `${heightPx}px`;

        const gridPx = state.plot.gridStepM * pxPerMeter;
        els.canvas.style.backgroundSize = `${gridPx}px ${gridPx}px`;

        els.canvas.innerHTML = '';

        for (const obj of state.objects) {
          els.canvas.appendChild(createObjectElement(obj));
        }
      }

      function createObjectElement(obj) {
        const el = document.createElement('div');

        el.className = 'object';
        el.dataset.id = obj.id;
        el.dataset.type = obj.type;

        if (obj.id === selectedId) {
          el.classList.add('selected');
        }

        if (!isPlacementValid(obj)) {
          el.classList.add('invalid');
        }

        el.style.left = `${obj.xM * pxPerMeter}px`;
        el.style.top = `${obj.yM * pxPerMeter}px`;
        el.style.width = `${obj.widthM * pxPerMeter}px`;
        el.style.height = `${obj.lengthM * pxPerMeter}px`;

        const cultureText = getObjectCultureSummary(obj);
        const tooltip = obj.tooltip || `${obj.name}${cultureText ? ` • ${cultureText}` : ''}`;

        el.title = tooltip;
        el.setAttribute('aria-label', tooltip);

        el.textContent = TYPE_EMOJI[obj.type] || '🌿';

        const minSidePx = Math.min(
          obj.widthM * pxPerMeter,
          obj.lengthM * pxPerMeter
        );

        el.style.fontSize = `${clamp(minSidePx * 0.55, 14, 32)}px`;

        el.addEventListener('pointerdown', (event) => {
          event.stopPropagation();
          selectObject(obj.id);
          startDrag(event, obj.id);
        });

        return el;
      }

      function getObjectCultureSummary(obj) {
        if (obj.type === 'greenhouse') {
          return `грядок: ${obj.greenhouseBedCount || 0}`;
        }

        return obj.culture || '';
      }

      function renderObjectList() {
        if (!els || !els.objectList) return;

        els.objectList.innerHTML = '';

        if (!state.objects.length) {
          els.objectList.innerHTML = '<div class="muted">Пока пусто. Добавьте первый объект 🌿</div>';
          return;
        }

        for (const obj of state.objects) {
          const button = document.createElement('button');

          button.type = 'button';
          button.className = 'list-item';
          button.dataset.type = obj.type;

          if (obj.id === selectedId) {
            button.classList.add('selected');
          }

          const summary = getObjectCultureSummary(obj);

          button.textContent =
            `${obj.name} • ${obj.widthM.toFixed(1)}×${obj.lengthM.toFixed(1)} м` +
            (summary ? ` • ${summary}` : '');

          button.addEventListener('click', () => {
            selectObject(obj.id);
          });

          els.objectList.appendChild(button);
        }
      }

      function selectObject(id) {
        selectedId = id;

        renderObjectList();
        renderProperties();
        updateSelectionClasses();
      }

      function updateSelectionClasses() {
        if (!els || !els.canvas) return;

        els.canvas.querySelectorAll('.object').forEach(el => {
          el.classList.toggle('selected', el.dataset.id === selectedId);
        });
      }

      function renderProperties() {
        if (!els || !els.propertiesBody) return;

        const obj = selectedObject();

        if (!obj) {
          els.propertiesBody.innerHTML = 'Выберите объект на схеме или в списке.';
          return;
        }

        let specific = '';

        if (obj.type === 'greenhouse') {
          const bedCount = clampInt(obj.greenhouseBedCount || 1, 1, 4);

          specific += `
            <div class="prop-field">
              <label>Количество грядок</label>
              <select id="prop-bed-count">
                ${[1, 2, 3, 4].map(value => `
                  <option value="${value}" ${value === bedCount ? 'selected' : ''}>
                    ${value}
                  </option>
                `).join('')}
              </select>
            </div>
          `;

          for (let i = 0; i < bedCount; i++) {
            const culture = obj.greenhouseBedCultures?.[i] || '';
            const date = obj.greenhouseBedPlantingDates?.[i] || '';

            specific += `
              <fieldset class="bed-box">
                <legend>Грядка ${i + 1}</legend>

                <div class="prop-field">
                  <label>Культура</label>
                  <select class="gh-bed-culture" data-index="${i}">
                    ${cultureOptions(culture, CROPS)}
                  </select>
                </div>

                <div class="prop-field">
                  <label>Дата посадки</label>
                  <input
                    type="date"
                    class="gh-bed-date"
                    data-index="${i}"
                    value="${escapeHtml(date)}"
                  />
                </div>
              </fieldset>
            `;
          }
        }

        if (obj.type === 'bed') {
          specific += `
            <div class="prop-field">
              <label>Культура</label>
              <select id="prop-culture">
                ${cultureOptions(obj.culture, CROPS)}
              </select>
            </div>

            <div class="prop-field">
              <label>Дата посадки</label>
              <input
                id="prop-planting-date"
                type="date"
                value="${escapeHtml(obj.plantingDate || '')}"
              />
            </div>
          `;
        }

        if (obj.type === 'tree' || obj.type === 'bush') {
          const cultures = obj.type === 'tree' ? TREE_CULTURES : BUSH_CULTURES;

          specific += `
            <div class="prop-field">
              <label>Культура</label>
              <select id="prop-culture">
                ${cultureOptions(obj.culture, cultures)}
              </select>
            </div>
          `;
        }

        els.propertiesBody.innerHTML = `
          <div class="prop-type">${TYPE_LABELS[obj.type]}</div>

          <div class="prop-field">
            <label>Название</label>
            <input id="prop-name" type="text" value="${escapeHtml(obj.name)}" />
          </div>

          <div class="prop-grid">
            <div class="prop-field">
              <label>X, м</label>
              <input id="prop-x" type="number" step="${state.plot.gridStepM}" value="${obj.xM.toFixed(2)}" />
            </div>

            <div class="prop-field">
              <label>Y, м</label>
              <input id="prop-y" type="number" step="${state.plot.gridStepM}" value="${obj.yM.toFixed(2)}" />
            </div>

            <div class="prop-field">
              <label>Ширина, м</label>
              <input id="prop-width" type="number" min="0.3" step="0.1" value="${obj.widthM.toFixed(2)}" />
            </div>

            <div class="prop-field">
              <label>Длина, м</label>
              <input id="prop-length" type="number" min="0.3" step="0.1" value="${obj.lengthM.toFixed(2)}" />
            </div>
          </div>

          ${specific}

          <button type="button" id="prop-delete" class="btn-danger">🗑 Удалить объект</button>
        `;

        bindPropertyEvents(obj);
      }

      function bindPropertyEvents(obj) {
        const root = els.propertiesBody;

        const nameEl = root.querySelector('#prop-name');
        const xEl = root.querySelector('#prop-x');
        const yEl = root.querySelector('#prop-y');
        const widthEl = root.querySelector('#prop-width');
        const lengthEl = root.querySelector('#prop-length');
        const deleteEl = root.querySelector('#prop-delete');
        const cultureEl = root.querySelector('#prop-culture');
        const plantingDateEl = root.querySelector('#prop-planting-date');
        const bedCountEl = root.querySelector('#prop-bed-count');

        on(nameEl, 'input', () => {
          obj.name = nameEl.value;
          renderCanvas();
          renderObjectList();
        });

        on(xEl, 'change', () => {
          obj.xM = clamp(
            snapValue(Number(xEl.value) || 0, state.plot.gridStepM),
            0,
            Math.max(0, state.plot.widthM - obj.widthM)
          );

          renderCanvas();
          validateObjectStatus(obj);
        });

        on(yEl, 'change', () => {
          obj.yM = clamp(
            snapValue(Number(yEl.value) || 0, state.plot.gridStepM),
            0,
            Math.max(0, state.plot.lengthM - obj.lengthM)
          );

          renderCanvas();
          validateObjectStatus(obj);
        });

        on(widthEl, 'change', () => {
          obj.widthM = clamp(Number(widthEl.value) || 0.5, 0.3, state.plot.widthM);
          obj.xM = clamp(obj.xM, 0, Math.max(0, state.plot.widthM - obj.widthM));

          renderCanvas();
          validateObjectStatus(obj);
        });

        on(lengthEl, 'change', () => {
          obj.lengthM = clamp(Number(lengthEl.value) || 0.5, 0.3, state.plot.lengthM);
          obj.yM = clamp(obj.yM, 0, Math.max(0, state.plot.lengthM - obj.lengthM));

          renderCanvas();
          validateObjectStatus(obj);
        });

        on(deleteEl, 'click', () => {
          state.objects = state.objects.filter(o => o.id !== obj.id);
          selectedId = null;

          renderAll();
        });

        on(cultureEl, 'change', () => {
          obj.culture = cultureEl.value || null;
          renderObjectList();
        });

        on(plantingDateEl, 'change', () => {
          obj.plantingDate = plantingDateEl.value || null;
        });

        on(bedCountEl, 'change', () => {
          setGreenhouseBedCount(obj.id, Number(bedCountEl.value));
          renderProperties();
          renderCanvas();
          renderObjectList();
        });

        root.querySelectorAll('.gh-bed-culture').forEach(select => {
          on(select, 'change', () => {
            const index = Number(select.dataset.index);

            if (!Array.isArray(obj.greenhouseBedCultures)) {
              obj.greenhouseBedCultures = [];
            }

            obj.greenhouseBedCultures[index] = select.value || null;
          });
        });

        root.querySelectorAll('.gh-bed-date').forEach(input => {
          on(input, 'change', () => {
            const index = Number(input.dataset.index);

            if (!Array.isArray(obj.greenhouseBedPlantingDates)) {
              obj.greenhouseBedPlantingDates = [];
            }

            obj.greenhouseBedPlantingDates[index] = input.value || null;
          });
        });
      }

      function setGreenhouseBedCount(id, count) {
        const obj = state.objects.find(o => o.id === id);

        if (!obj || obj.type !== 'greenhouse') return;

        const safeCount = clampInt(count, 1, 4);

        const cultures = Array.isArray(obj.greenhouseBedCultures)
          ? [...obj.greenhouseBedCultures]
          : [];

        const dates = Array.isArray(obj.greenhouseBedPlantingDates)
          ? [...obj.greenhouseBedPlantingDates]
          : [];

        while (cultures.length < safeCount) {
          cultures.push(null);
          dates.push(null);
        }

        if (cultures.length > safeCount) {
          cultures.length = safeCount;
          dates.length = safeCount;
        }

        obj.greenhouseBedCount = safeCount;
        obj.greenhouseBedCultures = cultures;
        obj.greenhouseBedPlantingDates = dates;
      }

      function startDrag(event, id) {
        const obj = state.objects.find(o => o.id === id);

        if (!obj) return;

        dragContext = {
          id,
          startX: event.clientX,
          startY: event.clientY,
          originX: obj.xM,
          originY: obj.yM,
          lastValidX: obj.xM,
          lastValidY: obj.yM
        };

        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', onDragEnd);
        document.addEventListener('pointercancel', onDragEnd);

        event.preventDefault();
      }

      function onDragMove(event) {
        if (!dragContext) return;

        const obj = state.objects.find(o => o.id === dragContext.id);

        if (!obj) return;

        const dx = (event.clientX - dragContext.startX) / pxPerMeter;
        const dy = (event.clientY - dragContext.startY) / pxPerMeter;

        let x = dragContext.originX + dx;
        let y = dragContext.originY + dy;

        x = snapValue(x, state.plot.gridStepM);
        y = snapValue(y, state.plot.gridStepM);

        x = clamp(x, 0, Math.max(0, state.plot.widthM - obj.widthM));
        y = clamp(y, 0, Math.max(0, state.plot.lengthM - obj.lengthM));

        obj.xM = x;
        obj.yM = y;

        const valid = isPlacementValid(obj);

        if (valid) {
          dragContext.lastValidX = x;
          dragContext.lastValidY = y;
          setStatus('');
        } else {
          setStatus('Пересечение или выход за границы участка');
        }

        updateObjectElement(obj, valid);
      }

      function onDragEnd() {
        if (!dragContext) return;

        const obj = state.objects.find(o => o.id === dragContext.id);

        if (obj && !isPlacementValid(obj)) {
          obj.xM = dragContext.lastValidX;
          obj.yM = dragContext.lastValidY;

          renderCanvas();
          showTemporaryStatus('Позиция возвращена из-за пересечения или границы');
        } else {
          setStatus('');
        }

        dragContext = null;

        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', onDragEnd);
        document.removeEventListener('pointercancel', onDragEnd);

        renderObjectList();
        renderProperties();
      }

      function updateObjectElement(obj, valid) {
        const el = getObjectEl(obj.id);

        if (!el) return;

        el.style.left = `${obj.xM * pxPerMeter}px`;
        el.style.top = `${obj.yM * pxPerMeter}px`;
        el.style.width = `${obj.widthM * pxPerMeter}px`;
        el.style.height = `${obj.lengthM * pxPerMeter}px`;

        el.classList.toggle('invalid', !valid);
      }

      function validateObjectStatus(obj) {
        const valid = isPlacementValid(obj);

        if (!valid) {
          setStatus('Объект пересекается или выходит за границы участка');
        } else {
          setStatus('');
        }

        const el = getObjectEl(obj.id);

        if (el) {
          el.classList.toggle('invalid', !valid);
        }

        return valid;
      }

      function isPlacementValid(obj) {
        const eps = 0.001;

        const insidePlot =
          obj.xM >= -eps &&
          obj.yM >= -eps &&
          obj.xM + obj.widthM <= state.plot.widthM + eps &&
          obj.yM + obj.lengthM <= state.plot.lengthM + eps;

        if (!insidePlot) return false;

        const hasCollision = state.objects.some(other => {
          if (other.id === obj.id) return false;

          return rectsIntersect(getObjectRect(obj), getObjectRect(other));
        });

        return !hasCollision;
      }

      function getObjectRect(obj) {
        return {
          x: obj.xM,
          y: obj.yM,
          w: obj.widthM,
          h: obj.lengthM
        };
      }

      function rectsIntersect(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }
