<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Умный садовод — веб-версия</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f3;
      color: #223;
    }

    button,
    input,
    select {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid #cfd8cf;
      border-radius: 8px;
      background: white;
    }

    button {
      cursor: pointer;
    }

    .primary {
      background: #2e7d32;
      border-color: #2e7d32;
      color: white;
    }

    .btn-danger {
      background: #d32f2f;
      border-color: #d32f2f;
      color: white;
      width: 100%;
      margin-top: 12px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: white;
      border-bottom: 1px solid #d7e0d7;
      min-height: 56px;
    }

    .toolbar label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar input,
    .toolbar select {
      width: 90px;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 340px;
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 64px);
    }

    .side {
      background: white;
      border: 1px solid #d7e0d7;
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
    }

    .side h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .palette-buttons {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .object-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .list-item {
      text-align: left;
      background: #fafafa;
      border: 1px solid #d7e0d7;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      line-height: 1.35;
    }

    .list-item.selected {
      border-color: #1976d2;
      background: #e3f2fd;
    }

    .canvas-wrap {
      position: relative;
      overflow: auto;
      padding: 16px;
      background: #eef6ee;
      border: 1px solid #d7e0d7;
      border-radius: 12px;
    }

    .canvas {
      position: relative;
      margin: auto;
      background: white;
      border: 2px solid #388e3c;
      border-radius: 4px;
      touch-action: none;
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.07) 1px, transparent 1px);
    }

    .object {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      overflow: hidden;
      border: 2px solid rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      font-size: 11px;
      text-align: center;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }

    .object.selected {
      outline: 3px solid #1976d2;
      z-index: 2;
    }

    .object.invalid {
      outline: 3px solid #d32f2f;
    }

    .status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .status.visible {
      opacity: 1;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .panel-header h3 {
      margin: 0;
    }

    .prop-type {
      font-size: 12px;
      color: #567;
      margin-bottom: 8px;
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0;
    }

    .prop-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .prop-field input,
    .prop-field select {
      width: 100%;
    }

    .bed-box {
      border: 1px solid #d7e0d7;
      border-radius: 10px;
      padding: 8px;
      margin: 8px 0;
    }

    .bed-box legend {
      font-size: 12px;
      padding: 0 4px;
      color: #456;
    }

    .muted {
      color: #667;
      font-size: 12px;
    }

    dialog {
      border: none;
      border-radius: 12px;
      padding: 16px;
      width: min(720px, calc(100vw - 32px));
      max-height: 80vh;
      overflow: auto;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.35);
    }

    dialog ol {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    dialog li small {
      color: #567;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 240px minmax(0, 1fr);
        height: calc(100vh - 84px);
      }

      .panel {
        position: fixed;
        right: 0;
        top: 64px;
        bottom: 0;
        width: min(420px, 100%);
        border-radius: 12px 0 0 12px;
        transform: translateX(110%);
        transition: transform 0.2s ease;
        z-index: 30;
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.08);
      }

      .panel.open {
        transform: translateX(0);
      }
    }

    @media (max-width: 760px) {
      .toolbar {
        overflow-x: auto;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(320px, 1fr);
        height: auto;
      }

      .palette-buttons {
        grid-template-columns: repeat(2, 1fr);
      }

      .side.palette {
        max-height: 220px;
      }

      .canvas-wrap {
        min-height: 55vh;
      }

      .panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 48vh;
        border-radius: 16px 16px 0 0;
        transform: translateY(110%);
      }

      .panel.open {
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header class="toolbar">
    <strong>Умный садовод</strong>

    <label>
      Ширина, м
      <input id="plotWidth" type="number" min="1" max="500" step="0.5" />
    </label>

    <label>
      Длина, м
      <input id="plotLength" type="number" min="1" max="500" step="0.5" />
    </label>

    <label>
      Сетка, м
      <select id="gridStep">
        <option value="0.1">0.1</option>
        <option value="0.25">0.25</option>
        <option value="0.5" selected>0.5</option>
        <option value="1">1</option>
      </select>
    </label>

    <button id="saveBtn">Сохранить</button>
    <button id="loadBtn">Загрузить</button>
    <button id="resetBtn">Сброс</button>
    <button id="generateBtn" class="primary">Календарь</button>
  </header>

  <div class="layout">
    <aside class="side palette">
      <h3>Добавить объект</h3>

      <div class="palette-buttons">
        <button class="add-object" data-type="building">Постройка</button>
        <button class="add-object" data-type="greenhouse">Теплица</button>
        <button class="add-object" data-type="bed">Грядка</button>
        <button class="add-object" data-type="tree">Дерево</button>
        <button class="add-object" data-type="bush">Кустарник</button>
      </div>

      <h3>Список объектов</h3>
      <div id="objectList" class="object-list"></div>
    </aside>

    <main class="canvas-wrap" id="canvasWrap">
      <div id="canvas" class="canvas"></div>
      <div id="status" class="status"></div>
    </main>

    <aside class="side panel" id="panel">
      <div class="panel-header">
        <h3>Настройки объекта</h3>
        <button id="closePanelBtn" title="Закрыть">✕</button>
      </div>

      <div id="propertiesBody">
        Выберите объект на схеме или в списке.
      </div>
    </aside>
  </div>

  <dialog id="calendarDialog">
    <div class="panel-header">
      <h3>Календарь работ</h3>
      <button id="closeCalendarBtn">✕</button>
    </div>

    <ol id="calendarList"></ol>
  </dialog>

  <script>
    const STORAGE_KEY = 'smart-gardener-web-plan-v1';

    const TYPE_LABELS = {
      building: 'Постройка',
      greenhouse: 'Теплица',
      bed: 'Грядка',
      tree: 'Дерево',
      bush: 'Кустарник'
    };

    const TYPE_COLORS = {
      building: '#d7ccc8',
      greenhouse: '#c8e6c9',
      bed: '#dcedc8',
      tree: '#b2dfdb',
      bush: '#ffe0b2'
    };

    const CROPS = [
      'Томат',
      'Огурец',
      'Перец',
      'Салат',
      'Клубника',
      'Укроп',
      'Петрушка',
      'Лук',
      'Чеснок',
      'Морковь',
      'Редис',
      'Кабачок',
      'Тыква'
    ];

    const TREE_CULTURES = [
      'Яблоня',
      'Груша',
      'Слива',
      'Вишня',
      'Черешня'
    ];

    const BUSH_CULTURES = [
      'Смородина',
      'Малина',
      'Крыжовник',
      'Ежевика',
      'Жимолость',
      'Виноград'
    ];

    let state = {
      plot: {
        widthM: 12,
        lengthM: 8,
        gridStepM: 0.5
      },
      objects: []
    };

    let selectedId = null;
    let pxPerMeter = 30;
    let dragContext = null;
    let saveTimer = null;

    const els = {
      plotWidth: document.getElementById('plotWidth'),
      plotLength: document.getElementById('plotLength'),
      gridStep: document.getElementById('gridStep'),
      saveBtn: document.getElementById('saveBtn'),
      loadBtn: document.getElementById('loadBtn'),
      resetBtn: document.getElementById('resetBtn'),
      generateBtn: document.getElementById('generateBtn'),
      canvasWrap: document.getElementById('canvasWrap'),
      canvas: document.getElementById('canvas'),
      status: document.getElementById('status'),
      objectList: document.getElementById('objectList'),
      panel: document.getElementById('panel'),
      closePanelBtn: document.getElementById('closePanelBtn'),
      propertiesBody: document.getElementById('propertiesBody'),
      calendarDialog: document.getElementById('calendarDialog'),
      closeCalendarBtn: document.getElementById('closeCalendarBtn'),
      calendarList: document.getElementById('calendarList')
    };

    init();

    function init() {
      loadPlan();
      syncPlotInputs();
      bindEvents();
      renderAll();
    }

    function bindEvents() {
      els.plotWidth.addEventListener('change', () => {
        state.plot.widthM = clamp(Number(els.plotWidth.value) || 12, 1, 500);
        clampAllObjects();
        renderAll();
        scheduleSave();
      });

      els.plotLength.addEventListener('change', () => {
        state.plot.lengthM = clamp(Number(els.plotLength.value) || 8, 1, 500);
        clampAllObjects();
        renderAll();
        scheduleSave();
      });

      els.gridStep.addEventListener('change', () => {
        state.plot.gridStepM = Number(els.gridStep.value) || 0.5;
        renderAll();
        scheduleSave();
      });

      document.querySelectorAll('.add-object').forEach(button => {
        button.addEventListener('click', () => {
          createObject(button.dataset.type);
        });
      });

      els.saveBtn.addEventListener('click', () => {
        savePlan();
        showTemporaryStatus('План сохранён');
      });

      els.loadBtn.addEventListener('click', () => {
        loadPlan();
        syncPlotInputs();
        renderAll();
        showTemporaryStatus('План загружен из localStorage');
      });

      els.resetBtn.addEventListener('click', () => {
        if (!confirm('Очистить текущий план?')) return;

        state.objects = [];
        selectedId = null;
        renderAll();
        savePlan();
      });

      els.generateBtn.addEventListener('click', generateAndShowCalendar);

      els.closePanelBtn.addEventListener('click', () => {
