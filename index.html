      /* Окно «Календарь» с рисунком    */
      /* ============================== */

      let calEls = null;

      function initCalendarModal() {
        calEls = {
          modal: document.getElementById('calendarModal'),
          stage: document.getElementById('calendarStage'),
          bg: document.getElementById('calendarBg'),
          text: document.getElementById('calendarText'),
          btnDown: document.getElementById('btnCalDown'),
          btnUp: document.getElementById('btnCalUp'),
          btnClose: document.getElementById('btnCalClose')
        };

        if (!calEls.modal) return;

        calEls.bg.addEventListener('error', () => {
          calEls.stage.classList.add('no-image');
        });

        on(calEls.btnDown, 'click', () => {
          calEls.text.scrollBy({ top: 140, behavior: 'smooth' });
        });

        on(calEls.btnUp, 'click', () => {
          calEls.text.scrollBy({ top: -140, behavior: 'smooth' });
        });

        on(calEls.btnClose, 'click', closeCalendarModal);

        on(calEls.modal, 'pointerdown', (event) => {
          if (event.target === calEls.modal) {
            closeCalendarModal();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !calEls.modal.hidden) {
            closeCalendarModal();
          }
        });
      }

      function openCalendarModal() {
        const result = generateCalendar();

        if (result.errors.length) {
          alert(result.errors.join('\n'));
          setStatus('Схема содержит ошибки');
          return;
        }

        renderCalendarText(result);

        calEls.modal.hidden = false;
      }

      function closeCalendarModal() {
        calEls.modal.hidden = true;
      }

      function renderCalendarText(result) {
        if (!result.tasks.length) {
          calEls.text.innerHTML = '<div class="cal-row">Нет будущих задач.</div>';
        } else {
          calEls.text.innerHTML = result.tasks
            .map(task => {
              return `<div class="cal-row"><span class="cal-date">${formatDateRu(task.date)}</span> — ${escapeHtml(task.title)}</div>`;
            })
            .join('');
        }

        calEls.text.scrollTop = 0;
      }

      function generateCalendar() {
        const errors = [];
        const tasks = [];
        const today = toDateStr(new Date());

        const hasPlants = state.objects.some(o => o.type !== 'building');

        if (!hasPlants) {
          errors.push('Добавьте хотя бы одно растение: грядку, теплицу, дерево или кустарник.');
        }

        for (const obj of state.objects) {
          if (obj.type === 'building') continue;

          if (obj.type === 'greenhouse') {
            const count = clampInt(obj.greenhouseBedCount || 0, 0, 4);

            if (count <= 0) {
              errors.push(`${obj.name}: укажите количество грядок в теплице.`);
              continue;
            }

            for (let i = 0; i < count; i++) {
              const culture = obj.greenhouseBedCultures?.[i];

              if (!culture) {
                errors.push(`${obj.name}, грядка ${i + 1}: выберите культуру.`);
                continue;
              }

              const baseDate = obj.greenhouseBedPlantingDates?.[i] || today;

              addCropTasks(
                tasks,
                baseDate,
                culture,
                `${obj.name}, грядка ${i + 1}`
              );
            }

            continue;
          }

          if (obj.type === 'bed') {
            if (!obj.culture) {
              errors.push(`${obj.name}: выберите культуру.`);
              continue;
            }

            addCropTasks(
              tasks,
              obj.plantingDate || today,
              obj.culture,
              obj.name
            );

            continue;
          }

          if (!obj.culture) {
            errors.push(`${obj.name}: выберите культуру.`);
            continue;
          }

          addPerennialTasks(tasks, obj.culture, obj.name);
        }

        const filteredTasks = tasks
          .filter(task => task.date >= today)
          .sort((a, b) => a.date.localeCompare(b.date));

        return {
          tasks: filteredTasks,
          errors
        };
      }

      function addCropTasks(tasks, baseIso, culture, objectName) {
        const base = baseIso || toDateStr(new Date());

        tasks.push({
          date: base,
          title: `Посадка/посев: ${culture}`,
          objectName,
          culture,
          mandatory: true
        });

        const wateringDays = [3, 6, 9, 12, 15, 18, 21, 24, 27, 30];

        for (const day of wateringDays) {
          tasks.push({
            date: addDays(base, day),
            title: `Полив: ${culture}`,
            objectName,
            culture,
            mandatory: true
          });
        }

        tasks.push({
          date: addDays(base, 14),
          title: `Подкормка: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: addDays(base, 21),
          title: `Проверка на вредителей: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: addDays(base, 70),
          title: `Сбор урожая: ${culture}`,
          objectName,
          culture,
          mandatory: true
        });
      }

      function addPerennialTasks(tasks, culture, objectName) {
        const today = new Date();
        const base = toDateStr(today);

        tasks.push({
          date: addDays(base, 2),
          title: `Полив после посадки: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: addDays(base, 10),
          title: `Обработка от вредителей: ${culture}`,
          objectName,
          culture,
          mandatory: true
        });

        const spring = new Date(today.getFullYear(), 2, 15);

        if (today > spring) {
          spring.setFullYear(spring.getFullYear() + 1);
        }

        const year = spring.getFullYear();

        tasks.push({
          date: `${year}-03-15`,
          title: `Весенняя обрезка: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: `${year}-04-01`,
          title: `Весенняя подкормка: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: `${year}-04-20`,
          title: `Обработка перед цветением: ${culture}`,
          objectName,
          culture,
          mandatory: true
        });
      }

      async function savePlanToFile() {
        if ('showSaveFilePicker' in window) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: 'smart-gardener-plan.json',
              types: [
                {
                  description: 'План участка (JSON)',
                  accept: {
                    'application/json': ['.json']
                  }
                }
              ]
            });

            const writable = await handle.createWritable();

            await writable.write(JSON.stringify(state, null, 2));
            await writable.close();

            fileHandle = handle;

            showTemporaryStatus('План сохранён в файл');
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') {
              return;
            }

            console.warn(
              'File System Access API не смог сохранить файл, используем запасной вариант.',
              error
            );
          }
        }

        try {
          downloadPlanFallback();

          showTemporaryStatus(
            'Файл выгружен через загрузку браузера. ' +
            'Чтобы выбрать папку вручную, включите в браузере настройку "Спрашивать, куда сохранять каждый файл".'
          );
        } catch (error) {
          console.error('Не удалось сохранить файл:', error);
          showTemporaryStatus('Не удалось сохранить файл');
        }
      }

      async function loadPlanFromFile() {
        if ('showOpenFilePicker' in window) {
          try {
            const [handle] = await window.showOpenFilePicker({
              multiple: false,
              types: [
                {
                  description: 'План участка (JSON)',
                  accept: {
                    'application/json': ['.json']
                  }
                }
              ]
            });

            const file = await handle.getFile();

            await applyPlanFile(file);

            fileHandle = handle;
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') {
              return;
            }

            console.warn(
              'File System Access API не смог открыть файл, используем запасной вариант.',
              error
            );
          }
        }

        if (els.fileInput) {
          els.fileInput.click();
        } else {
          showTemporaryStatus('Не удалось открыть диалог выбора файла');
        }
      }

      async function applyPlanFile(file) {
        try {
          const text = await file.text();

          const parsed = JSON.parse(text);

          if (!parsed || typeof parsed !== 'object') {
            throw new Error('Файл не является корректным объектом JSON');
          }

          if (!parsed.plot || !Array.isArray(parsed.objects)) {
            throw new Error('Файл не похож на план участка');
          }

          state = parsed;
          selectedId = null;

          normalizeState();
          renderAll();

          showTemporaryStatus('План загружен из файла');
        } catch (error) {
          console.error('Ошибка применения файла плана:', error);

          alert(
            'Не удалось загрузить файл плана.\n\n' +
            'Проверьте, что вы выбираете JSON-файл, сохранённый этой программой.'
          );
        }
      }

      function downloadPlanFallback() {
        const json = JSON.stringify(state, null, 2);

        const blob = new Blob([json], {
          type: 'application/json'
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');

        link.href = url;
        link.download = 'smart-gardener-plan.json';

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);
      }

      function normalizeState() {
        state.plot.widthM = clamp(Number(state.plot.widthM) || 12, 1, 500);
        state.plot.lengthM = clamp(Number(state.plot.lengthM) || 8, 1, 500);
        state.plot.gridStepM = Number(state.plot.gridStepM) || 0.5;

        if (!Array.isArray(state.objects)) {
          state.objects = [];
        }

        state.objects = state.objects.filter(obj => obj && TYPE_LABELS[obj.type]);

        state.objects.forEach((obj, index) => {
          if (!obj.id) {
            obj.id = makeId();
          }

          obj.name = obj.name || `${TYPE_LABELS[obj.type]} ${index + 1}`;
          obj.widthM = clamp(Number(obj.widthM) || 1, 0.3, state.plot.widthM);
          obj.lengthM = clamp(Number(obj.lengthM) || 1, 0.3, state.plot.lengthM);
          obj.xM = clamp(Number(obj.xM) || 0, 0, Math.max(0, state.plot.widthM - obj.widthM));
          obj.yM = clamp(Number(obj.yM) || 0, 0, Math.max(0, state.plot.lengthM - obj.lengthM));

          if (obj.type === 'greenhouse') {
            obj.greenhouseBedCount = clampInt(Number(obj.greenhouseBedCount) || 1, 1, 4);

            obj.greenhouseBedCultures = Array.from(
              { length: obj.greenhouseBedCount },
              (_, i) => obj.greenhouseBedCultures?.[i] ?? null
            );

            obj.greenhouseBedPlantingDates = Array.from(
              { length: obj.greenhouseBedCount },
              (_, i) => normalizeDate(obj.greenhouseBedPlantingDates?.[i])
            );
          }

          if (obj.type === 'bed') {
            obj.culture = obj.culture || null;
            obj.plantingDate = normalizeDate(obj.plantingDate);
          }

          if (obj.type === 'tree' || obj.type === 'bush') {
            obj.culture = obj.culture || null;
          }
        });

        clampAllObjects();
      }

      function clampAllObjects() {
        state.objects.forEach(obj => {
          obj.widthM = clamp(obj.widthM, 0.3, state.plot.widthM);
          obj.lengthM = clamp(obj.lengthM, 0.3, state.plot.lengthM);
          obj.xM = clamp(obj.xM, 0, Math.max(0, state.plot.widthM - obj.widthM));
          obj.yM = clamp(obj.yM, 0, Math.max(0, state.plot.lengthM - obj.lengthM));
        });
      }

      function selectedObject() {
        return state.objects.find(o => o.id === selectedId) || null;
      }

      function getObjectEl(id) {
        if (!els || !els.canvas) return null;

        return els.canvas.querySelector(`.object[data-id="${id}"]`);
      }

      function cultureOptions(selected, list) {
        const items = Array.isArray(list) ? [...list] : [];

        if (selected && !items.includes(selected)) {
          items.unshift(selected);
        }

        const options = ['<option value="">— не выбрана —</option>'];

        for (const item of items) {
          const selectedAttr = item === selected ? 'selected' : '';

          options.push(
            `<option value="${escapeHtml(item)}" ${selectedAttr}>${escapeHtml(item)}</option>`
          );
        }

        return options.join('');
      }

      function makeId() {
        if (window.crypto && crypto.randomUUID) {
          return crypto.randomUUID();
        }

        return `id_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      }

      function clamp(value, min, max) {
        if (max < min) return min;
        if (value < min) return min;
        if (value > max) return max;
        return value;
      }

      function clampInt(value, min, max) {
        if (max < min) return min;
        if (value < min) return min;
        if (value > max) return max;
        return value;
      }

      function snapValue(value, step) {
        return Math.round(value / step) * step;
      }

      function setStatus(text) {
        if (!els || !els.status) return;

        els.status.textContent = text || '';
        els.status.classList.toggle('visible', Boolean(text));
      }

      function showTemporaryStatus(text) {
        setStatus(text);

        setTimeout(() => {
          setStatus('');
        }, 2200);
      }

      function toDateStr(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');

        return `${y}-${m}-${d}`;
      }

      function addDays(isoDate, days) {
        const date = new Date(`${isoDate}T00:00:00`);
        date.setDate(date.getDate() + days);

        return toDateStr(date);
      }

      function formatDateRu(isoDate) {
        if (!isoDate) return '';

        const [y, m, d] = isoDate.split('-');

        return `${d}.${m}.${y}`;
      }

      function normalizeDate(value) {
        if (!value) return null;

        const str = String(value);

        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
          return str;
        }

        return null;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      function on(element, eventName, handler, options) {
        if (!element) {
          console.warn(`Умный садовод: не удалось навесить событие "${eventName}", элемент не найден.`);
          return;
        }

        element.addEventListener(eventName, handler, options);
      }

      /* =============================== */
      /* Интеграция редактора с чат-ботом */
      /* =============================== */

      function mapPlantTypeToObjectType(plantType) {
        const type = String(plantType || '').toLowerCase();

        if (type.includes('дерево')) {
          return 'tree';
        }

        if (type.includes('кустарник')) {
          return 'bush';
        }

        return 'bed';
      }

      function ensureCultureInLists(cultureName, objectType) {
        if (!cultureName) return;

        if (objectType === 'bed' && !CROPS.includes(cultureName)) {
          CROPS.push(cultureName);
        }

        if (objectType === 'tree' && !TREE_CULTURES.includes(cultureName)) {
          TREE_CULTURES.push(cultureName);
        }

        if (objectType === 'bush' && !BUSH_CULTURES.includes(cultureName)) {
          BUSH_CULTURES.push(cultureName);
        }
      }

      function addPlantFromChat(plant) {
        try {
          if (!plant || !plant.name) {
            console.warn('addPlantFromChat: пустой объект растения', plant);
            return false;
          }

          const objectType = mapPlantTypeToObjectType(plant.type);

          const obj = createObject(objectType);

          if (!obj) {
            throw new Error('Не удалось создать объект на схеме.');
          }

          obj.name = plant.name;

          if (objectType === 'bed' || objectType === 'tree' || objectType === 'bush') {
            ensureCultureInLists(plant.name, objectType);
            obj.culture = plant.name;
          }

          if (objectType === 'bed') {
            obj.plantingDate = null;
          }

          obj.tooltip =
            `${plant.name}` +
            `${plant.type ? ` • ${plant.type}` : ''}` +
            `${plant.sowing_timing ? ` • Посадка: ${plant.sowing_timing}` : ''}` +
            `${plant.harvest_timing ? ` • Урожай: ${plant.harvest_timing}` : ''}`;

          renderAll();
          selectObject(obj.id);

          showTemporaryStatus(`Добавлено растение: ${plant.name}`);

          return true;
        } catch (error) {
          console.error('Ошибка addPlantFromChat:', error);
          return false;
        }
      }

      window.SmartGardener = window.SmartGardener || {};
      window.SmartGardener.addPlantFromChat = addPlantFromChat;

      window.SmartGardener.check = function () {
        return {
          hasCreateObject: typeof createObject === 'function',
          hasState: typeof state !== 'undefined',
          hasRenderAll: typeof renderAll === 'function',
          hasSelectObject: typeof selectObject === 'function',
          hasShowTemporaryStatus: typeof showTemporaryStatus === 'function',
          hasTypeLabels: typeof TYPE_LABELS !== 'undefined',
          hasCrops: typeof CROPS !== 'undefined'
        };
      };

      console.info('SmartGardener API подключён:', window.SmartGardener.check());

      /* ============================== */
      /* Чат-бот                        */
      /* ============================== */

      let chatEls = null;
      let plants = [];
      let lastTypeFilter = 'all';

      const MONTH_FULL = [
        'Январь',
        'Февраль',
        'Март',
        'Апрель',
        'Май',
        'Июнь',
        'Июль',
        'Август',
        'Сентябрь',
        'Октябрь',
        'Ноябрь',
        'Декабрь'
      ];

      const MONTH_RE_SRC =
        '(?:январ|феврал|март|апрел|ма[йяе]|июн|июл|август|сентябр|октябр|ноябр|декабр)';

      function initChat() {
        chatEls = {
          toggle: document.getElementById('sgChatToggle'),
          panel: document.getElementById('sgChatPanel'),
          close: document.getElementById('sgChatCloseBtn'),
          loadBtn: document.getElementById('sgChatLoadBtn'),
          fileInput: document.getElementById('sgChatFileInput'),
          messages: document.getElementById('sgChatMessages'),
          quick: document.getElementById('sgChatQuick'),
          input: document.getElementById('sgChatInput'),
          sendBtn: document.getElementById('sgChatSendBtn')
        };

        if (!chatEls.toggle || !chatEls.panel) return;

        bindChatEvents();
        startChat();
        loadPlants();
      }

      function bindChatEvents() {
        chatEls.toggle.addEventListener('click', () => {
          chatEls.panel.hidden = !chatEls.panel.hidden;

          if (!chatEls.panel.hidden) {
            chatEls.input.focus();
          }
        });

        chatEls.close.addEventListener('click', () => {
          chatEls.panel.hidden = true;
        });

        chatEls.loadBtn.addEventListener('click', () => {
          chatEls.fileInput.click();
        });

        chatEls.fileInput.addEventListener('change', async () => {
          const file = chatEls.fileInput.files && chatEls.fileInput.files[0];

          if (!file) return;

          try {
            const text = await file.text();
            const raw = JSON.parse(text);

            plants = normalizePlants(raw);

            addBotMessage(
              `Файл растений загружен. Найдено культур: <strong>${plants.length}</strong>.`
            );
          } catch (error) {
            console.error(error);
            addBotMessage('Не удалось прочитать файл. Проверьте, что это корректный JSON.');
          }

          chatEls.fileInput.value = '';
        });

        chatEls.sendBtn.addEventListener('click', sendUserInput);

        chatEls.input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            sendUserInput();
          }
        });

        chatEls.messages.addEventListener('click', (event) => {
          const button = event.target.closest('button[data-action]');

          if (!button) return;

          handleChatAction(button.dataset.action, button.dataset.value);
        });

        chatEls.quick.addEventListener('click', (event) => {
          const button = event.target.closest('button[data-action]');

          if (!button) return;

          handleChatAction(button.dataset.action, button.dataset.value);
        });
      }

      function startChat() {
        chatEls.messages.innerHTML = '';

        addBotMessage(
          'Привет! Я помогу подобрать растения из вашей базы и составить сезонный календарь.<br><br>' +
          'Выберите действие:'
        );

        setQuickReplies([
          { label: '🌱 Подобрать растение', action: 'choose_plant' },
          { label: '🗓 Календарь по растению', action: 'calendar' },
          { label: 'ℹ️ Справка', action: 'help' }
        ]);
      }

      async function loadPlants() {
        try {
          const response = await fetch('plants.json');

          if (!response.ok) {
            throw new Error('HTTP error');
          }

          const raw = await response.json();

          plants = normalizePlants(raw);

          addBotMessage(
            `База растений загружена автоматически. Культур в базе: <strong>${plants.length}</strong>.`
          );
        } catch (error) {
          console.warn('Не удалось автоматически загрузить plants.json', error);

          addBotMessage(
            'Не удалось автоматически загрузить <strong>plants.json</strong>.<br>' +
            'Если вы открываете сайт через <code>file://</code>, браузер может блокировать fetch.<br><br>' +
            'Нажмите кнопку <strong>📂</strong> в шапке чата и выберите файл вручную.'
          );
        }
      }

      function handleChatAction(action, value) {
        if (action === 'start') {
          startChat();
          return;
        }

        if (action === 'help') {
          showHelp();
          return;
        }

        if (action === 'choose_plant') {
          askPlantType();
          return;
        }

        if (action === 'type') {
          showPlantsByType(value);
          return;
        }

        if (action === 'info') {
          const plant = getPlantByName(value);
          showPlantInfo(plant);
          return;
        }

        if (action === 'calendar') {
          askCalendarPlant();
          return;
        }

        if (action === 'calendar_for') {
          const plant = getPlantByName(value);
          showPlantCalendar(plant);
          return;
        }

        if (action === 'add_plan') {
          addPlantToApp(value);
          return;
        }

        if (action === 'show_all') {
          showAllPlants(value);
          return;
        }
      }

      function showHelp() {
        addBotMessage(
          'Я понимаю такие действия:<br><br>' +
          '1. <strong>Подобрать растение</strong> — выбор по типу: дерево, кустарник, овощ, зелень, ягода.<br>' +
          '2. <strong>Календарь по растению</strong> — сезонные работы для выбранной культуры.<br>' +
          '3. В поле ввода можно написать название растения, например: <em>яблоня</em>, <em>укроп</em>, <em>виноград</em>.<br><br>' +
          'Если база растений не загрузилась автоматически, нажмите 📂 и выберите файл <strong>plants.json</strong>.'
        );

        setQuickReplies([
          { label: '🏠 В начало', action: 'start' }
        ]);
      }

      function askPlantType() {
        if (!ensurePlantsLoaded()) return;

        addBotMessage('Какой тип растений вас интересует?');

        setQuickReplies([
          { label: '🌳 Дерево', action: 'type', value: 'дерево' },
          { label: '🌿 Кустарник', action: 'type', value: 'кустарник' },
          { label: '🥕 Овощ', action: 'type', value: 'овощ' },
          { label: '🌱 Зелень', action: 'type', value: 'зелень' },
          { label: '🍓 Ягода', action: 'type', value: 'ягода' },
          { label: '📚 Все растения', action: 'type', value: 'all' },
          { label: '⬅️ Назад', action: 'start' }
        ]);
      }

      function showPlantsByType(type) {
        if (!ensurePlantsLoaded()) return;

        lastTypeFilter = type;

        const list = filterPlantsByType(type);

        if (!list.length) {
          addBotMessage('По этому запросу ничего не найдено.');

          setQuickReplies([
            { label: '⬅️ Назад', action: 'choose_plant' },
            { label: '🏠 В начало', action: 'start' }
          ]);

          return;
        }

        addBotMessage(
          `Найдено растений: <strong>${list.length}</strong>.<br>` +
          'Нажмите на растение, чтобы посмотреть подробности.'
        );

        addPlantButtons(list, 'info', 10);

        setQuickReplies([
          { label: '⬅️ Типы растений', action: 'choose_plant' },
          { label: '🏠 В начало', action: 'start' }
        ]);
      }

      function showAllPlants(targetAction) {
        if (!ensurePlantsLoaded()) return;

        const list = filterPlantsByType(lastTypeFilter);

        addBotMessage(`Показываю все растения: <strong>${list.length}</strong>.`);

        addPlantButtons(list, targetAction || 'info', 999);

        setQuickReplies([
          { label: '🏠 В начало', action: 'start' }
        ]);
      }

      function askCalendarPlant() {
        if (!ensurePlantsLoaded()) return;

        addBotMessage(
          'Выберите растение, для которого нужно построить сезонный календарь.<br>' +
          'Или введите название растения в поле внизу.'
        );

        addPlantButtons(plants, 'calendar_for', 10);

        setQuickReplies([
          { label: 'Показать все', action: 'show_all', value: 'calendar_for' },
          { label: '🏠 В начало', action: 'start' }
        ]);
      }

      function showPlantInfo(plant) {
        if (!plant) {
          addBotMessage('Не нашёл такое растение в базе.');
          return;
        }

        const care = plant.care || {};

        const diseases = Array.isArray(plant.diseases)
          ? plant.diseases.join(', ')
          : '—';

        addBotMessage(
          `<strong>${escapeHtml(plant.name)}</strong><br><br>` +
          `<strong>Тип:</strong> ${escapeHtml(plant.type || '—')}<br>` +
          `<strong>Регион:</strong> ${escapeHtml(plant.region || '—')}<br>` +
          `<strong>Посадка:</strong> ${escapeHtml(plant.sowing_timing || '—')}<br>` +
          `<strong>Урожай:</strong> ${escapeHtml(plant.harvest_timing || '—')}<br><br>` +

          `<strong>Уход:</strong><br>` +
          careLine('Полив', care.watering) +
          careLine('Удобрения', care.fertilizer) +
          careLine('Обрезка', care.pruning) +
          careLine('Особенности', care.other) +

          `<br><strong>Болезни и вредители:</strong> ${escapeHtml(diseases)}`
        );

        setQuickReplies([
          { label: '🗓 Календарь', action: 'calendar_for', value: plant.name },
          { label: '➕ Добавить на схему', action: 'add_plan', value: plant.name },
          { label: '⬅️ Назад', action: 'choose_plant' },
          { label: '🏠 В начало', action: 'start' }
        ]);
      }

      function showPlantCalendar(plant) {
        if (!plant) {
          addBotMessage('Не нашёл такое растение в базе.');
          return;
        }

        const tasks = generatePlantCalendar(plant);

        if (!tasks.length) {
          addBotMessage(
            `Для растения <strong>${escapeHtml(plant.name)}</strong> ` +
            'не удалось автоматически выделить месяцы для календаря.<br><br>' +
            `<strong>Посадка:</strong> ${escapeHtml(plant.sowing_timing || '—')}<br>` +
            `<strong>Урожай:</strong> ${escapeHtml(plant.harvest_timing || '—')}`
          );
        } else {
          const rows = tasks
            .map(task => {
              return `• ${formatTaskDate(task.date)} — ${escapeHtml(task.title)}`;
            })
            .join('<br>');

          addBotMessage(
            `<strong>Сезонный календарь: ${escapeHtml(plant.name)}</strong><br><br>` +
            rows
          );
        }

        setQuickReplies([
          { label: '⬅️ Информация', action: 'info', value: plant.name },
          { label: '➕ Добавить на схему', action: 'add_plan', value: plant.name },
          { label: '🏠 В начало', action: 'start' }
        ]);
      }

      function addPlantToApp(name) {
        const plant = getPlantByName(name);

        if (!plant) {
          addBotMessage('Не нашёл такое растение в базе.');
          return;
        }

        if (
          window.SmartGardener &&
          typeof window.SmartGardener.addPlantFromChat === 'function'
        ) {
          const success = window.SmartGardener.addPlantFromChat(plant);

          if (success) {
            addBotMessage(
              `Растение <strong>${escapeHtml(plant.name)}</strong> добавлено на схему.`
            );

            setQuickReplies([
              { label: '🏠 В начало', action: 'start' }
            ]);

            setTimeout(() => {
              chatEls.panel.hidden = true;
            }, 300);
          } else {
            addBotMessage(
              'Не удалось добавить растение на схему.<br>' +
              'Откройте консоль браузера, чтобы посмотреть ошибку.'
            );

            setQuickReplies([
              { label: '🏠 В начало', action: 'start' }
            ]);
          }

          return;
        }

        addBotMessage(
          `Чтобы добавлять <strong>${escapeHtml(plant.name)}</strong> на схему, ` +
          'нужно подключить интеграцию чат-бота к редактору.'
        );

        setQuickReplies([
          { label: '🏠 В начало', action: 'start' }
        ]);
      }

      function sendUserInput() {
        const text = chatEls.input.value.trim();

        if (!text) return;

        addUserMessage(text);

        chatEls.input.value = '';

        if (!ensurePlantsLoaded()) return;

        const found = searchPlants(text);

        if (!found.length) {
          addBotMessage(
            'Не нашёл растение с таким названием.<br>' +
            'Попробуйте: яблоня, слива, укроп, огурец, клубника, виноград.'
          );

          setQuickReplies([
            { label: '🌱 Подобрать растение', action: 'choose_plant' },
            { label: '🏠 В начало', action: 'start' }
          ]);

          return;
        }

        if (found.length === 1) {
          showPlantInfo(found[0]);
          return;
        }

        addBotMessage(`Нашёл несколько растений: <strong>${found.length}</strong>.`);

        addPlantButtons(found, 'info', 10);

        setQuickReplies([
          { label: '🏠 В начало', action: 'start' }
        ]);
      }

      function ensurePlantsLoaded() {
        if (plants.length) return true;

        addBotMessage(
          'База растений ещё не загружена.<br>' +
          'Нажмите 📂 в шапке чата и выберите файл <strong>plants.json</strong>.'
        );

        return false;
      }

      function filterPlantsByType(type) {
        if (!Array.isArray(plants)) return [];

        if (!type || type === 'all') return plants;

        const t = String(type).toLowerCase();

        return plants.filter(plant => {
          const plantType = String(plant.type || '').toLowerCase();

          return plantType.includes(t);
        });
      }

      function searchPlants(query) {
        const q = String(query || '').toLowerCase();

        return plants.filter(plant => {
          const name = String(plant.name || '').toLowerCase();

          return name.includes(q);
        });
      }

      function getPlantByName(name) {
        if (!name) return null;

        const target = String(name).toLowerCase();

        return (
          plants.find(plant =>
            String(plant.name || '').toLowerCase() === target
          ) ||
          plants.find(plant =>
            String(plant.name || '').toLowerCase().includes(target)
          )
        );
      }

      function addPlantButtons(list, action, limit) {
        const wrap = document.createElement('div');
        wrap.className = 'sg-chat-plant-chips';

        const visible = list.slice(0, limit || 10);

        visible.forEach(plant => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'sg-chat-chip';
          button.textContent = plant.name;
          button.dataset.action = action;
          button.dataset.value = plant.name;

          wrap.appendChild(button);
        });

        if (list.length > (limit || 10)) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'sg-chat-chip';
          button.textContent = `Показать все (${list.length})`;
          button.dataset.action = 'show_all';
          button.dataset.value = action;

          wrap.appendChild(button);
        }

        chatEls.messages.appendChild(wrap);
        scrollMessages();
      }

      function addBotMessage(html) {
        const div = document.createElement('div');
        div.className = 'sg-chat-msg bot';
        div.innerHTML = html;

        chatEls.messages.appendChild(div);
        scrollMessages();
      }

      function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'sg-chat-msg user';
        div.textContent = text;

        chatEls.messages.appendChild(div);
        scrollMessages();
      }

      function setQuickReplies(items) {
        chatEls.quick.innerHTML = '';

        items.forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = item.label;
          button.dataset.action = item.action;

          if (item.value) {
            button.dataset.value = item.value;
          }

          chatEls.quick.appendChild(button);
        });
      }

      function scrollMessages() {
        chatEls.messages.scrollTop = chatEls.messages.scrollHeight;
      }

      function careLine(label, value) {
        if (!value) return '';

        return `<strong>${label}:</strong> ${escapeHtml(value)}<br>`;
      }

      function generatePlantCalendar(plant) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const tasks = [];
        const seen = new Set();

        function addMonthTask(month, title) {
          if (!month || month < 1 || month > 12) return;

          const date = dateFromMonth(month);

          if (date < today) return;

          const key = `${title}|${date.getFullYear()}-${date.getMonth()}`;

          if (seen.has(key)) return;

          seen.add(key);

          tasks.push({
            date,
            title
          });
        }

        const sowingMonths = extractMonths(plant.sowing_timing || '');
        const harvestMonths = extractMonths(plant.harvest_timing || '');

        sowingMonths.forEach(month => {
          addMonthTask(month, `Посадка/посев: ${plant.name}`);
        });

        harvestMonths.forEach(month => {
          addMonthTask(month, `Сбор урожая: ${plant.name}`);
        });

        const care = plant.care || {};

        const fertilizer = String(care.fertilizer || '').toLowerCase();

        if (fertilizer.includes('весна')) {
          addMonthTask(4, `Весенняя подкормка: ${plant.name}`);
        }

        if (fertilizer.includes('лето')) {
          addMonthTask(7, `Летняя подкормка: ${plant.name}`);
        }

        if (fertilizer.includes('осень')) {
          addMonthTask(9, `Осенняя подкормка: ${plant.name}`);
        }

        if (care.pruning && String(care.pruning).toLowerCase() !== 'null') {
          addMonthTask(3, `Обрезка/формировка: ${plant.name}`);
        }

        if (Array.isArray(plant.diseases) && plant.diseases.length) {
          addMonthTask(5, `Профилактика болезней и вредителей: ${plant.name}`);
        }

        if (care.watering) {
          const wateringDate = new Date(today);
          wateringDate.setDate(wateringDate.getDate() + 7);

          tasks.push({
            date: wateringDate,
            title: `Полив по графику: ${plant.name}`
          });
        }

        return tasks
          .sort((a, b) => a.date - b.date)
          .slice(0, 20);
      }

      function dateFromMonth(month) {
        const now = new Date();

        const currentMonth = now.getMonth() + 1;
        const currentDay = now.getDate();

        let year = now.getFullYear();
        let day = 1;

        if (month < currentMonth) {
          year++;
        }

        if (month === currentMonth) {
          day = currentDay;
        }

        return new Date(year, month - 1, day);
      }

      function formatTaskDate(date) {
        return `${MONTH_FULL[date.getMonth()]} ${date.getFullYear()}`;
      }

      function extractMonths(text) {
        if (!text) return [];

        const lower = String(text).toLowerCase();
        const set = new Set();

        const segments = lower.split(/[,;]|(?:\s+(?:или|и)\s+)/);

        segments.forEach(segment => {
          const allMonthMatches = segment.match(new RegExp(MONTH_RE_SRC, 'g')) || [];

          allMonthMatches.forEach(word => {
            const month = monthNumberFromWord(word);

            if (month) {
              set.add(month);
            }
          });

          const rangeRe = new RegExp(
            '(' + MONTH_RE_SRC + ')[^–-—]*?[–-—][^–-—]*?(' + MONTH_RE_SRC + ')',
            'g'
          );

          let match;

          while ((match = rangeRe.exec(segment)) !== null) {
            const a = monthNumberFromWord(match[1]);
            const b = monthNumberFromWord(match[2]);

            if (a && b) {
              fillRange(set, a, b);
            }
          }
        });

        return Array.from(set).sort((a, b) => a - b);
      }

      function fillRange(set, a, b) {
        if (a <= b) {
          for (let m = a; m <= b; m++) {
            set.add(m);
          }
        } else {
          for (let m = a; m <= 12; m++) {
            set.add(m);
          }

          for (let m = 1; m <= b; m++) {
            set.add(m);
          }
        }
      }

      function monthNumberFromWord(word) {
        if (word.startsWith('январ')) return 1;
        if (word.startsWith('феврал')) return 2;
        if (word.startsWith('март')) return 3;
        if (word.startsWith('апрел')) return 4;
        if (word.startsWith('ма')) return 5;
        if (word.startsWith('июн')) return 6;
        if (word.startsWith('июл')) return 7;
        if (word.startsWith('август')) return 8;
        if (word.startsWith('сентябр')) return 9;
        if (word.startsWith('октябр')) return 10;
        if (word.startsWith('ноябр')) return 11;
        if (word.startsWith('декабр')) return 12;

        return null;
      }

      function normalizePlants(raw) {
        const cleaned = deepTrim(raw);

        let list = [];

        if (Array.isArray(cleaned)) {
          list = cleaned;
        } else if (cleaned && typeof cleaned === 'object') {
          list = cleaned.plants || cleaned['plants'] || [];
        }

        return list.filter(item => item && item.name);
      }

      function deepTrim(value) {
        if (typeof value === 'string') {
          return value.trim();
        }

        if (Array.isArray(value)) {
          return value.map(deepTrim);
        }

        if (value && typeof value === 'object') {
          const result = {};

          Object.entries(value).forEach(([key, val]) => {
            result[key.trim()] = deepTrim(val);
          });

          return result;
        }

        return value;
      }
    })();
