<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Умный садовод</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #F7F3EC;
      --text: #2C2C2C;

      --card: #FFF9EE;
      --card-green: #EAF5DF;
      --card-beige: #F6EFDD;

      --shadow: 0 10px 20px rgba(70, 60, 40, 0.12);
      --shadow-hover: 0 16px 28px rgba(70, 60, 40, 0.18);

      --radius-card: 16px;
      --radius-big: 24px;
      --radius-huge: 30px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: 0.2px;
    }

    body.ui-hidden {
      overflow: hidden;
    }

    h1,
    h2,
    h3,
    h4,
    .section-title {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.3;
      margin: 0 0 10px;
    }

    .app-title {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.2;
      letter-spacing: 0.3px;
      margin: 0;
      color: #2F4C33;
    }

    /* Шапка */

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 249, 238, 0.94);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 18px rgba(70, 60, 40, 0.08);
    }

    .toolbar label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #4B4B4B;
    }

    .toolbar input,
    .toolbar select {
      width: 92px;
    }

    .toolbar-buttons {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Кнопки */

    button {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 15px;
      text-transform: none;
      padding: 10px 16px;
      border: none;
      border-radius: 18px;
      color: var(--text);
      background: linear-gradient(180deg, #FFF3D6, #FFE7B8);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition:
        transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.18s ease,
        filter 0.18s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: var(--shadow-hover);
      filter: saturate(1.05);
    }

    button:active {
      transform: translateY(0) scale(0.98);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(133, 208, 124, 0.5);
      outline-offset: 2px;
    }

    #saveBtn {
      background: linear-gradient(180deg, #D8F1FF, #BFE3FF);
    }

    #loadBtn {
      background: linear-gradient(180deg, #DFF8E6, #C4EDD4);
    }

    #resetBtn {
      background: linear-gradient(180deg, #FFE1EC, #FFC7DE);
    }

    #generateBtn {
      background: linear-gradient(180deg, #C9F3B9, #A9E8A0);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 14px;
      font-size: 18px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #FFF7E8, #F6EBD2);
    }

    /* Поля ввода */

    input,
    select {
      font-family: "Inter", Arial, sans-serif;
      font-size: 15px;
      color: var(--text);
      padding: 10px 12px;
      border: none;
      border-radius: 14px;
      background: #FFFDF7;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        0 6px 14px rgba(70, 60, 40, 0.08);
    }

    /* Блок подсказок */

    #hintBar {
      position: relative;
      z-index: 5;
      margin: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border-radius: var(--radius-big);
      box-shadow: var(--shadow);
    }

    .hint-content {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hint-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: help;
    }

    /* Активная подсказка должна быть выше соседних */
    .hint-pill:hover {
      z-index: 60;
    }

    /* Номер шага: в стиле кнопки, но чуть темнее */
    .hint-step-number {
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: linear-gradient(180deg, #FFE4A8, #F5D186);
      color: #5C451F;
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 12px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 3px 8px rgba(70, 60, 40, 0.10);
    }

    /* Всплывающая подсказка снизу кнопки */
    .hint-pill::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 10px);
      bottom: auto;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      background: rgba(255, 253, 247, 0.96);
      color: #4B4B4B;
      border: 1px solid rgba(121, 96, 62, 0.14);
      box-shadow: 0 12px 22px rgba(70, 60, 40, 0.16);

      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      text-align: center;

      padding: 7px 10px;
      border-radius: 10px;

      width: max-content;
      max-width: 240px;
      white-space: normal;

      transition:
        opacity 0.16s ease,
        transform 0.16s ease,
        visibility 0.16s ease;

      z-index: 80;
    }

    /* Стрелка подсказки снизу кнопки */
    .hint-pill::before {
      content: "";
      position: absolute;
      top: calc(100% + 4px);
      bottom: auto;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);

      width: 0;
      height: 0;

      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 0;
      border-bottom: 6px solid rgba(255, 253, 247, 0.96);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.16s ease,
        transform 0.16s ease,
        visibility 0.16s ease;

      z-index: 80;
    }

    /* Показываем подсказку только при наведении */
    .hint-pill:hover::after,
    .hint-pill:hover::before {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Раскладка */

    .layout {
      display: grid;
      gap: 16px;
      padding: 0 16px 16px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 1024px) {
      .layout {
        grid-template-columns: 300px minmax(0, 1fr) 360px;
        height: calc(100vh - 190px);
      }
    }

    .side {
      background: var(--card);
      border-radius: var(--radius-big);
      box-shadow: var(--shadow);
      padding: 16px;
      overflow: auto;
    }

    .palette-buttons {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .add-object {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      border-radius: var(--radius-card);
      background: linear-gradient(180deg, #FDF7E7, #F1F7DF);
      font-size: 16px;
    }

    .object-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      border-radius: var(--radius-card);
      background: linear-gradient(180deg, #FFF9EE, #F4F6DF);
      font-size: 14px;
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 600;
    }

    .list-item.selected {
      background: linear-gradient(180deg, #EFFFF4, #DFF8E3);
      box-shadow:
        0 0 0 3px rgba(134, 214, 151, 0.35),
        var(--shadow);
    }

    .list-item::before {
      font-size: 16px;
      line-height: 1;
    }

    /* Холст */

    .canvas-wrap {
      position: relative;
      border-radius: var(--radius-huge);
      box-shadow: var(--shadow);
      padding: 16px;
      overflow: auto;
      min-height: 380px;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.2)),
        linear-gradient(135deg, #F5FBEC, #EDF7DD);
    }

    .canvas {
      position: relative;
      margin: auto;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow:
        inset 0 0 0 1px rgba(120, 160, 120, 0.08),
        0 14px 28px rgba(70, 60, 40, 0.08);
      touch-action: none;
      background-image:
        linear-gradient(to right, rgba(70, 110, 80, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(70, 110, 80, 0.06) 1px, transparent 1px);
    }

    /* Объекты на схеме: эмодзи, подсказки и цветная обводка */

    .object {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      border: 2px solid rgba(0, 0, 0, 0.12);
      background: #FFFFFF;
      box-shadow: 0 8px 16px rgba(70, 60, 40, 0.12);
      border-radius: 18px;
      line-height: 1;
      color: #2C2C2C;
      font-family:
        "Inter",
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
      user-select: none;
      touch-action: none;
      cursor: grab;
      animation: stickerPop 0.28s ease;
      transition:
        transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.18s ease,
        background-color 0.18s ease,
        border-color 0.18s ease;
    }

    .object:hover {
      transform: translateY(-4px) scale(1.07);
      box-shadow: 0 12px 22px rgba(70, 60, 40, 0.18);
    }

    .object:active {
      cursor: grabbing;
      transform: scale(0.98);
    }

    /* Цвет и обводка для типов объектов */

    .object[data-type="building"] {
      background: linear-gradient(180deg, #FFF7EF, #F9E8D4);
      border-color: #D9B48F;
    }

    .object[data-type="greenhouse"] {
      background: linear-gradient(180deg, #F3FFF5, #DCF2E0);
      border-color: #9CCFA8;
    }

    .object[data-type="bed"] {
      background: linear-gradient(180deg, #F9FFE9, #E5F7CF);
      border-color: #B0D37E;
    }

    .object[data-type="tree"] {
      background: linear-gradient(180deg, #F0FFFB, #D9F0EC);
      border-color: #96C9C1;
    }

    .object[data-type="bush"] {
      background: linear-gradient(180deg, #FFF9EC, #FDECCB);
      border-color: #E2BE88;
    }

    /* Выбранный объект */

    .object.selected {
      box-shadow:
        0 0 0 3px rgba(84, 190, 116, 0.30),
        0 10px 18px rgba(70, 60, 40, 0.16);
    }

    /* Невалидное размещение */

    .object.invalid {
      border-color: #F07281;
      background: rgba(255, 59, 48, 0.10);
    }

    /* Эмодзи для списка объектов */

    .list-item[data-type="building"]::before {
      content: "🏠";
    }

    .list-item[data-type="greenhouse"]::before {
      content: "🌱";
    }

    .list-item[data-type="bed"]::before {
      content: "🥕";
    }

    .list-item[data-type="tree"]::before {
      content: "🌳";
    }

    .list-item[data-type="bush"]::before {
      content: "🌵";
    }

    /* Панель настроек */

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .panel-header .section-title {
      margin: 0;
    }

    .properties-body {
      font-size: 15px;
    }

    .prop-type {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #6B805C;
      margin-bottom: 8px;
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0;
    }

    .prop-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: #5C5C5C;
      margin-bottom: 10px;
    }

    .properties-body input,
    .properties-body select {
      width: 100%;
      font-size: 15px;
    }

    .bed-box {
      border-radius: var(--radius-card);
      background: #F3FAE9;
      padding: 10px;
      margin: 10px 0;
      box-shadow: var(--shadow);
    }

    .bed-box legend {
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #3E7C4F;
      padding: 0 4px;
    }

    .btn-danger {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(180deg, #FFE1EC, #FFC7DE);
    }

    /* Статус */

    .status {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 5;
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(44, 44, 44, 0.82);
      color: white;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      box-shadow: var(--shadow);
    }

    .status.visible {
      opacity: 1;
    }

    /* Диалог календаря */

    dialog {
      border: none;
      border-radius: 28px;
      padding: 18px;
      width: min(760px, calc(100vw - 32px));
      max-height: 80vh;
      overflow: auto;
      background: linear-gradient(180deg, #FFFFFF, #FFF9EE);
      box-shadow: var(--shadow-hover);
    }

    dialog::backdrop {
      background: rgba(60, 50, 30, 0.35);
      backdrop-filter: blur(3px);
    }

    dialog[open] {
      animation: stickerPop 0.28s ease;
    }

    .calendar-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .calendar-list li {
      border-radius: var(--radius-card);
      background: linear-gradient(180deg, #FFFDF6, #F5F7E6);
      box-shadow: var(--shadow);
      padding: 10px 12px;
    }

    .calendar-list small {
      color: #6F8168;
    }

    .muted {
      border-radius: var(--radius-card);
      background: #FFF8EC;
      padding: 10px;
      color: #7A6C54;
      font-size: 14px;
      box-shadow: var(--shadow);
    }

    /* Кнопка мобильного режима */

    .ui-toggle-btn {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 70;
      padding: 12px 16px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #C9F3B9, #A9E8A0);
      box-shadow: 0 14px 26px rgba(70, 60, 40, 0.2);
      font-family: "Montserrat", "Inter", sans-serif;
      font-weight: 700;
      font-size: 14px;
    }

    .ui-toggle-btn:hover {
      transform: translateY(-3px) scale(1.03);
    }

    /* Скрытый режим: оставляем только схему */

    body.ui-hidden .toolbar,
    body.ui-hidden #hintBar,
    body.ui-hidden .palette,
    body.ui-hidden .panel {
      display: none;
    }

    body.ui-hidden .layout {
      display: block;
      padding: 0;
      height: 100vh;
      height: 100dvh;
    }

    body.ui-hidden .canvas-wrap {
      position: fixed;
      inset: 0;
      border-radius: 0;
      padding: 8px;
      min-height: 100vh;
      min-height: 100dvh;
      z-index: 10;
    }

    /* Анимации */

    @keyframes stickerPop {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(4px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Мобильная адаптация */

    @media (max-width: 1023px) {
      .toolbar {
        padding: 10px 12px;
        gap: 8px;
      }

      .toolbar label {
        font-size: 12px;
      }

      .toolbar input,
      .toolbar select {
        width: 76px;
        padding: 8px 10px;
      }

      .toolbar-buttons {
        width: 100%;
        margin-left: 0;
        justify-content: flex-start;
      }

      .canvas-wrap {
        min-height: 55vh;
      }

      #hintBar {
        margin: 12px;
        padding: 12px;
      }

      .layout {
        padding: 0 12px 12px;
        gap: 12px;
      }

      .hint-pill::after {
        max-width: 180px;
      }
    }
  </style>
</head>

<body>

  <header class="toolbar">
    <h1 class="app-title">🌱 Умный садовод</h1>

    <label>
      Ширина, м
      <input id="plotWidth" type="number" min="1" max="500" step="0.5" />
    </label>

    <label>
      Длина, м
      <input id="plotLength" type="number" min="1" max="500" step="0.5" />
    </label>

    <label>
      Сетка, м
      <select id="gridStep">
        <option value="0.1">0.1</option>
        <option value="0.25">0.25</option>
        <option value="0.5" selected>0.5</option>
        <option value="1">1</option>
      </select>
    </label>

    <div class="toolbar-buttons">
      <button type="button" id="saveBtn">💾 Сохранить</button>
      <button type="button" id="loadBtn">📂 Загрузить</button>
      <button type="button" id="resetBtn">🧹 Сбросить</button>
      <button type="button" id="generateBtn">🗓 Календарь</button>
    </div>
  </header>

  <div id="hintBar">
    <div class="hint-content">
      <button
        type="button"
        class="hint-pill"
        data-tip="Шаг 1 из 4: добавьте объект на участок"
        aria-label="Шаг 1 из 4: добавьте объект на участок"
      >
        <span class="hint-step-number">1</span>
        <span>🌿 Добавьте объект</span>
      </button>

      <button
        type="button"
        class="hint-pill"
        data-tip="Шаг 2 из 4: перетащите объект на участок"
        aria-label="Шаг 2 из 4: перетащите объект на участок"
      >
        <span class="hint-step-number">2</span>
        <span>🖐 Перетащите его на участок</span>
      </button>

      <button
        type="button"
        class="hint-pill"
        data-tip="Шаг 3 из 4: кликните по объекту, чтобы настроить его параметры"
        aria-label="Шаг 3 из 4: кликните по объекту, чтобы настроить его параметры"
      >
        <span class="hint-step-number">3</span>
        <span>⚙️ Кликните, чтобы настроить</span>
      </button>

      <button
        type="button"
        class="hint-pill"
        data-tip="Шаг 4 из 4: сохраните план в файл"
        aria-label="Шаг 4 из 4: сохраните план в файл"
      >
        <span class="hint-step-number">4</span>
        <span>💾 Сохраните план в файл</span>
      </button>
    </div>

    <button type="button" id="closeHintBtn" class="icon-btn" title="Скрыть подсказки">
      ✕
    </button>
  </div>

  <main class="layout">

    <aside class="side palette">
      <h2 class="section-title">Добавить объект</h2>

      <div class="palette-buttons">
        <button type="button" class="add-object" data-type="building">🏠 Постройка</button>
        <button type="button" class="add-object" data-type="greenhouse">🌱 Теплица</button>
        <button type="button" class="add-object" data-type="bed">🥕 Грядка</button>
        <button type="button" class="add-object" data-type="tree">🌳 Дерево</button>
        <button type="button" class="add-object" data-type="bush">🌵 Кустарник</button>
      </div>

      <h2 class="section-title">Объекты</h2>
      <div id="objectList" class="object-list"></div>
    </aside>

    <section id="canvasWrap" class="canvas-wrap">
      <div id="canvas" class="canvas"></div>
      <div id="status" class="status"></div>
    </section>

    <aside id="panel" class="side panel">
      <div class="panel-header">
        <h2 class="section-title">Настройки объекта</h2>
        <button type="button" id="closePanelBtn" class="icon-btn" title="Закрыть панель">✕</button>
      </div>

      <div id="propertiesBody">
        Выберите объект на схеме или в списке.
      </div>
    </aside>

  </main>

  <dialog id="calendarDialog">
    <div class="panel-header">
      <h2 class="section-title">🗓 Календарь работ</h2>
      <button type="button" id="closeCalendarBtn" class="icon-btn" title="Закрыть календарь">✕</button>
    </div>

    <ol id="calendarList" class="calendar-list"></ol>
  </dialog>

  <input
    type="file"
    id="fileInput"
    accept=".json,application/json"
    hidden
  />

  <button type="button" id="uiToggleBtn" class="ui-toggle-btn">
    🙈 Скрыть параметры
  </button>

  <script>
    (function () {
      'use strict';

      const TYPE_LABELS = {
        building: 'Постройка',
        greenhouse: 'Теплица',
        bed: 'Грядка',
        tree: 'Дерево',
        bush: 'Кустарник'
      };

      const TYPE_EMOJI = {
        building: '🏠',
        greenhouse: '🌱',
        bed: '🥕',
        tree: '🌳',
        bush: '🌵'
      };

      const CROPS = [
        'Томат',
        'Огурец',
        'Перец',
        'Салат',
        'Клубника',
        'Укроп',
        'Петрушка',
        'Лук',
        'Чеснок',
        'Морковь',
        'Редис',
        'Кабачок',
        'Тыква'
      ];

      const TREE_CULTURES = [
        'Яблоня',
        'Груша',
        'Слива',
        'Вишня',
        'Черешня'
      ];

      const BUSH_CULTURES = [
        'Смородина',
        'Малина',
        'Крыжовник',
        'Ежевика',
        'Жимолость',
        'Виноград'
      ];

      let state = {
        plot: {
          widthM: 12,
          lengthM: 8,
          gridStepM: 0.5
        },
        objects: []
      };

      let els = null;
      let selectedId = null;
      let pxPerMeter = 30;
      let dragContext = null;
      let fileHandle = null;

      function ready(callback) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', callback);
        } else {
          callback();
        }
      }

      ready(initApp);

      function initApp() {
        els = {
          plotWidth: document.getElementById('plotWidth'),
          plotLength: document.getElementById('plotLength'),
          gridStep: document.getElementById('gridStep'),
          saveBtn: document.getElementById('saveBtn'),
          loadBtn: document.getElementById('loadBtn'),
          resetBtn: document.getElementById('resetBtn'),
          generateBtn: document.getElementById('generateBtn'),
          canvasWrap: document.getElementById('canvasWrap'),
          canvas: document.getElementById('canvas'),
          status: document.getElementById('status'),
          objectList: document.getElementById('objectList'),
          panel: document.getElementById('panel'),
          closePanelBtn: document.getElementById('closePanelBtn'),
          propertiesBody: document.getElementById('propertiesBody'),
          calendarDialog: document.getElementById('calendarDialog'),
          closeCalendarBtn: document.getElementById('closeCalendarBtn'),
          calendarList: document.getElementById('calendarList'),
          fileInput: document.getElementById('fileInput'),
          hintBar: document.getElementById('hintBar'),
          closeHintBtn: document.getElementById('closeHintBtn'),
          uiToggleBtn: document.getElementById('uiToggleBtn')
        };

        const missing = Object.entries(els)
          .filter(([key, value]) => !value)
          .map(([key]) => key);

        if (missing.length) {
          console.error('Умный садовод: не найдены элементы с id:', missing.join(', '));
          return;
        }

        syncPlotInputs();
        bindEvents();
        renderAll();

        console.info('Умный садовод: интерфейс инициализирован.');
      }

      function bindEvents() {
        on(els.plotWidth, 'change', () => {
          state.plot.widthM = clamp(Number(els.plotWidth.value) || 12, 1, 500);
          clampAllObjects();
          renderAll();
        });

        on(els.plotLength, 'change', () => {
          state.plot.lengthM = clamp(Number(els.plotLength.value) || 8, 1, 500);
          clampAllObjects();
          renderAll();
        });

        on(els.gridStep, 'change', () => {
          state.plot.gridStepM = Number(els.gridStep.value) || 0.5;
          renderAll();
        });

        document.querySelectorAll('.add-object').forEach(button => {
          on(button, 'click', () => {
            createObject(button.dataset.type);
          });
        });

        on(els.saveBtn, 'click', savePlanToFile);
        on(els.loadBtn, 'click', loadPlanFromFile);

        on(els.resetBtn, 'click', () => {
          if (!confirm('Очистить текущий план?')) return;

          state.objects = [];
          selectedId = null;
          fileHandle = null;

          renderAll();
          showTemporaryStatus('План очищен. Нажмите «Загрузить», чтобы открыть файл.');
        });

        on(els.generateBtn, 'click', generateAndShowCalendar);

        on(els.fileInput, 'change', async () => {
          const file = els.fileInput.files && els.fileInput.files[0];

          if (!file) return;

          await applyPlanFile(file);

          els.fileInput.value = '';
        });

        on(els.closePanelBtn, 'click', () => {
          selectedId = null;
          renderAll();
        });

        on(els.closeCalendarBtn, 'click', () => {
          if (els.calendarDialog && typeof els.calendarDialog.close === 'function') {
            els.calendarDialog.close();
          }
        });

        on(els.closeHintBtn, 'click', () => {
          if (els.hintBar) {
            els.hintBar.remove();
          }
        });

        // Убираем фокус с кнопок-подсказок после клика,
        // чтобы активной оставалась только подсказка под курсором.
        document.querySelectorAll('.hint-pill').forEach(button => {
          on(button, 'click', () => {
            button.blur();
          });
        });

        on(els.uiToggleBtn, 'click', () => {
          const hidden = document.body.classList.toggle('ui-hidden');

          els.uiToggleBtn.textContent = hidden
            ? '⚙️ Показать параметры'
            : '🙈 Скрыть параметры';

          requestAnimationFrame(renderCanvas);
        });

        on(els.canvas, 'pointerdown', (event) => {
          if (event.target === els.canvas) {
            selectedId = null;
            renderProperties();
            renderObjectList();
            updateSelectionClasses();
          }
        });

        window.addEventListener('resize', renderCanvas);

        on(document.body, 'dragover', (event) => {
          event.preventDefault();
        });

        on(document.body, 'drop', async (event) => {
          event.preventDefault();

          const file = event.dataTransfer.files && event.dataTransfer.files[0];

          if (!file) return;

          const isJson =
            file.type === 'application/json' ||
            file.name.toLowerCase().endsWith('.json');

          if (isJson) {
            await applyPlanFile(file);
          }
        });
      }

      function createObject(type) {
        if (!TYPE_LABELS[type]) {
          console.warn('Неизвестный тип объекта:', type);
          return;
        }

        const defaults = {
          building: { w: 3, l: 4 },
          greenhouse: { w: 3, l: 6 },
          bed: { w: 1, l: 3 },
          tree: { w: 2, l: 2 },
          bush: { w: 1, l: 1 }
        };

        const count = state.objects.filter(o => o.type === type).length + 1;

        const obj = {
          id: makeId(),
          type,
          name: `${TYPE_LABELS[type]} ${count}`,
          xM: 0,
          yM: 0,
          widthM: Math.min(defaults[type].w, state.plot.widthM),
          lengthM: Math.min(defaults[type].l, state.plot.lengthM),
          rotation: 0
        };

        if (type === 'bed') {
          obj.culture = null;
          obj.plantingDate = null;
        }

        if (type === 'tree' || type === 'bush') {
          obj.culture = null;
        }

        if (type === 'greenhouse') {
          obj.greenhouseBedCount = 2;
          obj.greenhouseBedCultures = [null, null];
          obj.greenhouseBedPlantingDates = [null, null];
        }

        findFreeSpot(obj);

        state.objects.push(obj);
        selectedId = obj.id;

        renderAll();
      }

      function findFreeSpot(obj) {
        const searchStep = Math.max(state.plot.gridStepM, 0.5);

        const maxX = Math.max(0, state.plot.widthM - obj.widthM);
        const maxY = Math.max(0, state.plot.lengthM - obj.lengthM);

        for (let y = 0; y <= maxY + 0.001; y += searchStep) {
          for (let x = 0; x <= maxX + 0.001; x += searchStep) {
            obj.xM = Number(x.toFixed(2));
            obj.yM = Number(y.toFixed(2));

            if (isPlacementValid(obj)) {
              return;
            }
          }
        }

        obj.xM = 0;
        obj.yM = 0;
      }

      function renderAll() {
        syncPlotInputs();
        renderCanvas();
        renderObjectList();
        renderProperties();
      }

      function syncPlotInputs() {
        if (!els) return;

        els.plotWidth.value = state.plot.widthM;
        els.plotLength.value = state.plot.lengthM;
        els.gridStep.value = String(state.plot.gridStepM);
      }

      function renderCanvas() {
        if (!els || !els.canvasWrap || !els.canvas) return;

        const availableWidth = Math.max(80, els.canvasWrap.clientWidth - 32);
        const availableHeight = Math.max(80, els.canvasWrap.clientHeight - 32);

        pxPerMeter = Math.max(
          12,
          Math.min(
            availableWidth / state.plot.widthM,
            availableHeight / state.plot.lengthM
          )
        );

        const widthPx = state.plot.widthM * pxPerMeter;
        const heightPx = state.plot.lengthM * pxPerMeter;

        els.canvas.style.width = `${widthPx}px`;
        els.canvas.style.height = `${heightPx}px`;

        const gridPx = state.plot.gridStepM * pxPerMeter;
        els.canvas.style.backgroundSize = `${gridPx}px ${gridPx}px`;

        els.canvas.innerHTML = '';

        for (const obj of state.objects) {
          els.canvas.appendChild(createObjectElement(obj));
        }
      }

      function createObjectElement(obj) {
        const el = document.createElement('div');

        el.className = 'object';
        el.dataset.id = obj.id;
        el.dataset.type = obj.type;

        if (obj.id === selectedId) {
          el.classList.add('selected');
        }

        if (!isPlacementValid(obj)) {
          el.classList.add('invalid');
        }

        el.style.left = `${obj.xM * pxPerMeter}px`;
        el.style.top = `${obj.yM * pxPerMeter}px`;
        el.style.width = `${obj.widthM * pxPerMeter}px`;
        el.style.height = `${obj.lengthM * pxPerMeter}px`;

        const cultureText = getObjectCultureSummary(obj);
        const tooltip = `${obj.name}${cultureText ? ` • ${cultureText}` : ''}`;

        el.title = tooltip;
        el.setAttribute('aria-label', tooltip);

        // Показываем только эмодзи.
        // Название объекта и культура остаются в подсказке.
        el.textContent = TYPE_EMOJI[obj.type] || '🌿';

        // Подбираем размер эмодзи под размер объекта на схеме.
        const minSidePx = Math.min(
          obj.widthM * pxPerMeter,
          obj.lengthM * pxPerMeter
        );

        el.style.fontSize = `${clamp(minSidePx * 0.55, 14, 32)}px`;

        el.addEventListener('pointerdown', (event) => {
          event.stopPropagation();
          selectObject(obj.id);
          startDrag(event, obj.id);
        });

        return el;
      }

      function getObjectCultureSummary(obj) {
        if (obj.type === 'greenhouse') {
          return `грядок: ${obj.greenhouseBedCount || 0}`;
        }

        return obj.culture || '';
      }

      function renderObjectList() {
        if (!els || !els.objectList) return;

        els.objectList.innerHTML = '';

        if (!state.objects.length) {
          els.objectList.innerHTML = '<div class="muted">Пока пусто. Добавьте первый объект 🌿</div>';
          return;
        }

        for (const obj of state.objects) {
          const button = document.createElement('button');

          button.type = 'button';
          button.className = 'list-item';
          button.dataset.type = obj.type;

          if (obj.id === selectedId) {
            button.classList.add('selected');
          }

          const summary = getObjectCultureSummary(obj);

          button.textContent =
            `${obj.name} • ${obj.widthM.toFixed(1)}×${obj.lengthM.toFixed(1)} м` +
            (summary ? ` • ${summary}` : '');

          button.addEventListener('click', () => {
            selectObject(obj.id);
          });

          els.objectList.appendChild(button);
        }
      }

      function selectObject(id) {
        selectedId = id;

        renderObjectList();
        renderProperties();
        updateSelectionClasses();
      }

      function updateSelectionClasses() {
        if (!els || !els.canvas) return;

        els.canvas.querySelectorAll('.object').forEach(el => {
          el.classList.toggle('selected', el.dataset.id === selectedId);
        });
      }

      function renderProperties() {
        if (!els || !els.propertiesBody) return;

        const obj = selectedObject();

        if (!obj) {
          els.propertiesBody.innerHTML = 'Выберите объект на схеме или в списке.';
          return;
        }

        let specific = '';

        if (obj.type === 'greenhouse') {
          const bedCount = clampInt(obj.greenhouseBedCount || 1, 1, 4);

          specific += `
            <div class="prop-field">
              <label>Количество грядок</label>
              <select id="prop-bed-count">
                ${[1, 2, 3, 4].map(value => `
                  <option value="${value}" ${value === bedCount ? 'selected' : ''}>
                    ${value}
                  </option>
                `).join('')}
              </select>
            </div>
          `;

          for (let i = 0; i < bedCount; i++) {
            const culture = obj.greenhouseBedCultures?.[i] || '';
            const date = obj.greenhouseBedPlantingDates?.[i] || '';

            specific += `
              <fieldset class="bed-box">
                <legend>Грядка ${i + 1}</legend>

                <div class="prop-field">
                  <label>Культура</label>
                  <select class="gh-bed-culture" data-index="${i}">
                    ${cultureOptions(culture, CROPS)}
                  </select>
                </div>

                <div class="prop-field">
                  <label>Дата посадки</label>
                  <input
                    type="date"
                    class="gh-bed-date"
                    data-index="${i}"
                    value="${escapeHtml(date)}"
                  />
                </div>
              </fieldset>
            `;
          }
        }

        if (obj.type === 'bed') {
          specific += `
            <div class="prop-field">
              <label>Культура</label>
              <select id="prop-culture">
                ${cultureOptions(obj.culture, CROPS)}
              </select>
            </div>

            <div class="prop-field">
              <label>Дата посадки</label>
              <input
                id="prop-planting-date"
                type="date"
                value="${escapeHtml(obj.plantingDate || '')}"
              />
            </div>
          `;
        }

        if (obj.type === 'tree' || obj.type === 'bush') {
          const cultures = obj.type === 'tree' ? TREE_CULTURES : BUSH_CULTURES;

          specific += `
            <div class="prop-field">
              <label>Культура</label>
              <select id="prop-culture">
                ${cultureOptions(obj.culture, cultures)}
              </select>
            </div>
          `;
        }

        els.propertiesBody.innerHTML = `
          <div class="prop-type">${TYPE_LABELS[obj.type]}</div>

          <div class="prop-field">
            <label>Название</label>
            <input id="prop-name" type="text" value="${escapeHtml(obj.name)}" />
          </div>

          <div class="prop-grid">
            <div class="prop-field">
              <label>X, м</label>
              <input id="prop-x" type="number" step="${state.plot.gridStepM}" value="${obj.xM.toFixed(2)}" />
            </div>

            <div class="prop-field">
              <label>Y, м</label>
              <input id="prop-y" type="number" step="${state.plot.gridStepM}" value="${obj.yM.toFixed(2)}" />
            </div>

            <div class="prop-field">
              <label>Ширина, м</label>
              <input id="prop-width" type="number" min="0.3" step="0.1" value="${obj.widthM.toFixed(2)}" />
            </div>

            <div class="prop-field">
              <label>Длина, м</label>
              <input id="prop-length" type="number" min="0.3" step="0.1" value="${obj.lengthM.toFixed(2)}" />
            </div>
          </div>

          ${specific}

          <button type="button" id="prop-delete" class="btn-danger">🗑 Удалить объект</button>
        `;

        bindPropertyEvents(obj);
      }

      function bindPropertyEvents(obj) {
        const root = els.propertiesBody;

        const nameEl = root.querySelector('#prop-name');
        const xEl = root.querySelector('#prop-x');
        const yEl = root.querySelector('#prop-y');
        const widthEl = root.querySelector('#prop-width');
        const lengthEl = root.querySelector('#prop-length');
        const deleteEl = root.querySelector('#prop-delete');
        const cultureEl = root.querySelector('#prop-culture');
        const plantingDateEl = root.querySelector('#prop-planting-date');
        const bedCountEl = root.querySelector('#prop-bed-count');

        on(nameEl, 'input', () => {
          obj.name = nameEl.value;
          renderCanvas();
          renderObjectList();
        });

        on(xEl, 'change', () => {
          obj.xM = clamp(
            snapValue(Number(xEl.value) || 0, state.plot.gridStepM),
            0,
            Math.max(0, state.plot.widthM - obj.widthM)
          );

          renderCanvas();
          validateObjectStatus(obj);
        });

        on(yEl, 'change', () => {
          obj.yM = clamp(
            snapValue(Number(yEl.value) || 0, state.plot.gridStepM),
            0,
            Math.max(0, state.plot.lengthM - obj.lengthM)
          );

          renderCanvas();
          validateObjectStatus(obj);
        });

        on(widthEl, 'change', () => {
          obj.widthM = clamp(Number(widthEl.value) || 0.5, 0.3, state.plot.widthM);
          obj.xM = clamp(obj.xM, 0, Math.max(0, state.plot.widthM - obj.widthM));

          renderCanvas();
          validateObjectStatus(obj);
        });

        on(lengthEl, 'change', () => {
          obj.lengthM = clamp(Number(lengthEl.value) || 0.5, 0.3, state.plot.lengthM);
          obj.yM = clamp(obj.yM, 0, Math.max(0, state.plot.lengthM - obj.lengthM));

          renderCanvas();
          validateObjectStatus(obj);
        });

        on(deleteEl, 'click', () => {
          state.objects = state.objects.filter(o => o.id !== obj.id);
          selectedId = null;

          renderAll();
        });

        on(cultureEl, 'change', () => {
          obj.culture = cultureEl.value || null;
          renderObjectList();
        });

        on(plantingDateEl, 'change', () => {
          obj.plantingDate = plantingDateEl.value || null;
        });

        on(bedCountEl, 'change', () => {
          setGreenhouseBedCount(obj.id, Number(bedCountEl.value));
          renderProperties();
          renderCanvas();
          renderObjectList();
        });

        root.querySelectorAll('.gh-bed-culture').forEach(select => {
          on(select, 'change', () => {
            const index = Number(select.dataset.index);

            if (!Array.isArray(obj.greenhouseBedCultures)) {
              obj.greenhouseBedCultures = [];
            }

            obj.greenhouseBedCultures[index] = select.value || null;
          });
        });

        root.querySelectorAll('.gh-bed-date').forEach(input => {
          on(input, 'change', () => {
            const index = Number(input.dataset.index);

            if (!Array.isArray(obj.greenhouseBedPlantingDates)) {
              obj.greenhouseBedPlantingDates = [];
            }

            obj.greenhouseBedPlantingDates[index] = input.value || null;
          });
        });
      }

      function setGreenhouseBedCount(id, count) {
        const obj = state.objects.find(o => o.id === id);

        if (!obj || obj.type !== 'greenhouse') return;

        const safeCount = clampInt(count, 1, 4);

        const cultures = Array.isArray(obj.greenhouseBedCultures)
          ? [...obj.greenhouseBedCultures]
          : [];

        const dates = Array.isArray(obj.greenhouseBedPlantingDates)
          ? [...obj.greenhouseBedPlantingDates]
          : [];

        while (cultures.length < safeCount) {
          cultures.push(null);
          dates.push(null);
        }

        if (cultures.length > safeCount) {
          cultures.length = safeCount;
          dates.length = safeCount;
        }

        obj.greenhouseBedCount = safeCount;
        obj.greenhouseBedCultures = cultures;
        obj.greenhouseBedPlantingDates = dates;
      }

      function startDrag(event, id) {
        const obj = state.objects.find(o => o.id === id);

        if (!obj) return;

        dragContext = {
          id,
          startX: event.clientX,
          startY: event.clientY,
          originX: obj.xM,
          originY: obj.yM,
          lastValidX: obj.xM,
          lastValidY: obj.yM
        };

        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', onDragEnd);
        document.addEventListener('pointercancel', onDragEnd);

        event.preventDefault();
      }

      function onDragMove(event) {
        if (!dragContext) return;

        const obj = state.objects.find(o => o.id === dragContext.id);

        if (!obj) return;

        const dx = (event.clientX - dragContext.startX) / pxPerMeter;
        const dy = (event.clientY - dragContext.startY) / pxPerMeter;

        let x = dragContext.originX + dx;
        let y = dragContext.originY + dy;

        x = snapValue(x, state.plot.gridStepM);
        y = snapValue(y, state.plot.gridStepM);

        x = clamp(x, 0, Math.max(0, state.plot.widthM - obj.widthM));
        y = clamp(y, 0, Math.max(0, state.plot.lengthM - obj.lengthM));

        obj.xM = x;
        obj.yM = y;

        const valid = isPlacementValid(obj);

        if (valid) {
          dragContext.lastValidX = x;
          dragContext.lastValidY = y;
          setStatus('');
        } else {
          setStatus('Пересечение или выход за границы участка');
        }

        updateObjectElement(obj, valid);
      }

      function onDragEnd() {
        if (!dragContext) return;

        const obj = state.objects.find(o => o.id === dragContext.id);

        if (obj && !isPlacementValid(obj)) {
          obj.xM = dragContext.lastValidX;
          obj.yM = dragContext.lastValidY;

          renderCanvas();
          showTemporaryStatus('Позиция возвращена из-за пересечения или границы');
        } else {
          setStatus('');
        }

        dragContext = null;

        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', onDragEnd);
        document.removeEventListener('pointercancel', onDragEnd);

        renderObjectList();
        renderProperties();
      }

      function updateObjectElement(obj, valid) {
        const el = getObjectEl(obj.id);

        if (!el) return;

        el.style.left = `${obj.xM * pxPerMeter}px`;
        el.style.top = `${obj.yM * pxPerMeter}px`;
        el.style.width = `${obj.widthM * pxPerMeter}px`;
        el.style.height = `${obj.lengthM * pxPerMeter}px`;

        el.classList.toggle('invalid', !valid);
      }

      function validateObjectStatus(obj) {
        const valid = isPlacementValid(obj);

        if (!valid) {
          setStatus('Объект пересекается или выходит за границы участка');
        } else {
          setStatus('');
        }

        const el = getObjectEl(obj.id);

        if (el) {
          el.classList.toggle('invalid', !valid);
        }

        return valid;
      }

      function isPlacementValid(obj) {
        const eps = 0.001;

        const insidePlot =
          obj.xM >= -eps &&
          obj.yM >= -eps &&
          obj.xM + obj.widthM <= state.plot.widthM + eps &&
          obj.yM + obj.lengthM <= state.plot.lengthM + eps;

        if (!insidePlot) return false;

        const hasCollision = state.objects.some(other => {
          if (other.id === obj.id) return false;

          return rectsIntersect(getObjectRect(obj), getObjectRect(other));
        });

        return !hasCollision;
      }

      function getObjectRect(obj) {
        return {
          x: obj.xM,
          y: obj.yM,
          w: obj.widthM,
          h: obj.lengthM
        };
      }

      function rectsIntersect(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      function generateAndShowCalendar() {
        const result = generateCalendar();

        if (result.errors.length) {
          alert(result.errors.join('\n'));
          setStatus('Схема содержит ошибки');
          return;
        }

        if (!result.tasks.length) {
          els.calendarList.innerHTML = '<li>Нет будущих задач.</li>';
        } else {
          els.calendarList.innerHTML = result.tasks.map(task => `
            <li>
              <strong>${formatDateRu(task.date)}</strong> — ${escapeHtml(task.title)}
              <br />
              <small>
                ${escapeHtml(task.objectName)} • ${escapeHtml(task.culture)} •
                ${task.mandatory ? 'обязательно' : 'рекомендуется'}
              </small>
            </li>
          `).join('');
        }

        if (els.calendarDialog && typeof els.calendarDialog.showModal === 'function') {
          els.calendarDialog.showModal();
        } else {
          alert('Календарь сформирован, но диалоговое окно недоступно в этом браузере.');
        }
      }

      function generateCalendar() {
        const errors = [];
        const tasks = [];
        const today = toDateStr(new Date());

        const hasPlants = state.objects.some(o => o.type !== 'building');

        if (!hasPlants) {
          errors.push('Добавьте хотя бы одно растение: грядку, теплицу, дерево или кустарник.');
        }

        for (const obj of state.objects) {
          if (obj.type === 'building') continue;

          if (obj.type === 'greenhouse') {
            const count = clampInt(obj.greenhouseBedCount || 0, 0, 4);

            if (count <= 0) {
              errors.push(`${obj.name}: укажите количество грядок в теплице.`);
              continue;
            }

            for (let i = 0; i < count; i++) {
              const culture = obj.greenhouseBedCultures?.[i];

              if (!culture) {
                errors.push(`${obj.name}, грядка ${i + 1}: выберите культуру.`);
                continue;
              }

              const baseDate = obj.greenhouseBedPlantingDates?.[i] || today;

              addCropTasks(
                tasks,
                baseDate,
                culture,
                `${obj.name}, грядка ${i + 1}`
              );
            }

            continue;
          }

          if (obj.type === 'bed') {
            if (!obj.culture) {
              errors.push(`${obj.name}: выберите культуру.`);
              continue;
            }

            addCropTasks(
              tasks,
              obj.plantingDate || today,
              obj.culture,
              obj.name
            );

            continue;
          }

          if (!obj.culture) {
            errors.push(`${obj.name}: выберите культуру.`);
            continue;
          }

          addPerennialTasks(tasks, obj.culture, obj.name);
        }

        const filteredTasks = tasks
          .filter(task => task.date >= today)
          .sort((a, b) => a.date.localeCompare(b.date));

        return {
          tasks: filteredTasks,
          errors
        };
      }

      function addCropTasks(tasks, baseIso, culture, objectName) {
        const base = baseIso || toDateStr(new Date());

        tasks.push({
          date: base,
          title: `Посадка/посев: ${culture}`,
          objectName,
          culture,
          mandatory: true
        });

        const wateringDays = [3, 6, 9, 12, 15, 18, 21, 24, 27, 30];

        for (const day of wateringDays) {
          tasks.push({
            date: addDays(base, day),
            title: `Полив: ${culture}`,
            objectName,
            culture,
            mandatory: true
          });
        }

        tasks.push({
          date: addDays(base, 14),
          title: `Подкормка: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: addDays(base, 21),
          title: `Проверка на вредителей: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: addDays(base, 70),
          title: `Сбор урожая: ${culture}`,
          objectName,
          culture,
          mandatory: true
        });
      }

      function addPerennialTasks(tasks, culture, objectName) {
        const today = new Date();
        const base = toDateStr(today);

        tasks.push({
          date: addDays(base, 2),
          title: `Полив после посадки: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: addDays(base, 10),
          title: `Обработка от вредителей: ${culture}`,
          objectName,
          culture,
          mandatory: true
        });

        const spring = new Date(today.getFullYear(), 2, 15);

        if (today > spring) {
          spring.setFullYear(spring.getFullYear() + 1);
        }

        const year = spring.getFullYear();

        tasks.push({
          date: `${year}-03-15`,
          title: `Весенняя обрезка: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: `${year}-04-01`,
          title: `Весенняя подкормка: ${culture}`,
          objectName,
          culture,
          mandatory: false
        });

        tasks.push({
          date: `${year}-04-20`,
          title: `Обработка перед цветением: ${culture}`,
          objectName,
          culture,
          mandatory: true
        });
      }

      async function savePlanToFile() {
        if ('showSaveFilePicker' in window) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: 'smart-gardener-plan.json',
              types: [
                {
                  description: 'План участка (JSON)',
                  accept: {
                    'application/json': ['.json']
                  }
                }
              ]
            });

            const writable = await handle.createWritable();

            await writable.write(JSON.stringify(state, null, 2));
            await writable.close();

            fileHandle = handle;

            showTemporaryStatus('План сохранён в файл');
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') {
              return;
            }

            console.warn(
              'File System Access API не смог сохранить файл, используем запасной вариант.',
              error
            );
          }
        }

        try {
          downloadPlanFallback();

          showTemporaryStatus(
            'Файл выгружен через загрузку браузера. ' +
            'Чтобы выбрать папку вручную, включите в браузере настройку "Спрашивать, куда сохранять каждый файл".'
          );
        } catch (error) {
          console.error('Не удалось сохранить файл:', error);
          showTemporaryStatus('Не удалось сохранить файл');
        }
      }

      async function loadPlanFromFile() {
        if ('showOpenFilePicker' in window) {
          try {
            const [handle] = await window.showOpenFilePicker({
              multiple: false,
              types: [
                {
                  description: 'План участка (JSON)',
                  accept: {
                    'application/json': ['.json']
                  }
                }
              ]
            });

            const file = await handle.getFile();

            await applyPlanFile(file);

            fileHandle = handle;
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') {
              return;
            }

            console.warn(
              'File System Access API не смог открыть файл, используем запасной вариант.',
              error
            );
          }
        }

        if (els.fileInput) {
          els.fileInput.click();
        } else {
          showTemporaryStatus('Не удалось открыть диалог выбора файла');
        }
      }

      async function applyPlanFile(file) {
        try {
          const text = await file.text();

          const parsed = JSON.parse(text);

          if (!parsed || typeof parsed !== 'object') {
            throw new Error('Файл не является корректным объектом JSON');
          }

          if (!parsed.plot || !Array.isArray(parsed.objects)) {
            throw new Error('Файл не похож на план участка');
          }

          state = parsed;
          selectedId = null;

          normalizeState();
          renderAll();

          showTemporaryStatus('План загружен из файла');
        } catch (error) {
          console.error('Ошибка применения файла плана:', error);

          alert(
            'Не удалось загрузить файл плана.\n\n' +
            'Проверьте, что вы выбираете JSON-файл, сохранённый этой программой.'
          );
        }
      }

      function downloadPlanFallback() {
        const json = JSON.stringify(state, null, 2);

        const blob = new Blob([json], {
          type: 'application/json'
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');

        link.href = url;
        link.download = 'smart-gardener-plan.json';

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);
      }

      function normalizeState() {
        state.plot.widthM = clamp(Number(state.plot.widthM) || 12, 1, 500);
        state.plot.lengthM = clamp(Number(state.plot.lengthM) || 8, 1, 500);
        state.plot.gridStepM = Number(state.plot.gridStepM) || 0.5;

        if (!Array.isArray(state.objects)) {
          state.objects = [];
        }

        state.objects = state.objects.filter(obj => obj && TYPE_LABELS[obj.type]);

        state.objects.forEach((obj, index) => {
          if (!obj.id) {
            obj.id = makeId();
          }

          obj.name = obj.name || `${TYPE_LABELS[obj.type]} ${index + 1}`;
          obj.widthM = clamp(Number(obj.widthM) || 1, 0.3, state.plot.widthM);
          obj.lengthM = clamp(Number(obj.lengthM) || 1, 0.3, state.plot.lengthM);
          obj.xM = clamp(Number(obj.xM) || 0, 0, Math.max(0, state.plot.widthM - obj.widthM));
          obj.yM = clamp(Number(obj.yM) || 0, 0, Math.max(0, state.plot.lengthM - obj.lengthM));

          if (obj.type === 'greenhouse') {
            obj.greenhouseBedCount = clampInt(Number(obj.greenhouseBedCount) || 1, 1, 4);

            obj.greenhouseBedCultures = Array.from(
              { length: obj.greenhouseBedCount },
              (_, i) => obj.greenhouseBedCultures?.[i] ?? null
            );

            obj.greenhouseBedPlantingDates = Array.from(
              { length: obj.greenhouseBedCount },
              (_, i) => normalizeDate(obj.greenhouseBedPlantingDates?.[i])
            );
          }

          if (obj.type === 'bed') {
            obj.culture = obj.culture || null;
            obj.plantingDate = normalizeDate(obj.plantingDate);
          }

          if (obj.type === 'tree' || obj.type === 'bush') {
            obj.culture = obj.culture || null;
          }
        });

        clampAllObjects();
      }

      function clampAllObjects() {
        state.objects.forEach(obj => {
          obj.widthM = clamp(obj.widthM, 0.3, state.plot.widthM);
          obj.lengthM = clamp(obj.lengthM, 0.3, state.plot.lengthM);
          obj.xM = clamp(obj.xM, 0, Math.max(0, state.plot.widthM - obj.widthM));
          obj.yM = clamp(obj.yM, 0, Math.max(0, state.plot.lengthM - obj.lengthM));
        });
      }

      function selectedObject() {
        return state.objects.find(o => o.id === selectedId) || null;
      }

      function getObjectEl(id) {
        if (!els || !els.canvas) return null;

        return els.canvas.querySelector(`.object[data-id="${id}"]`);
      }

      function cultureOptions(selected, list) {
        const options = ['<option value="">— не выбрана —</option>'];

        for (const item of list) {
          const selectedAttr = item === selected ? 'selected' : '';
          options.push(`<option value="${escapeHtml(item)}" ${selectedAttr}>${escapeHtml(item)}</option>`);
        }

        return options.join('');
      }

      function makeId() {
        if (window.crypto && crypto.randomUUID) {
          return crypto.randomUUID();
        }

        return `id_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      }

      function clamp(value, min, max) {
        if (max < min) return min;
        if (value < min) return min;
        if (value > max) return max;
        return value;
      }

      function clampInt(value, min, max) {
        if (max < min) return min;
        if (value < min) return min;
        if (value > max) return max;
        return value;
      }

      function snapValue(value, step) {
        return Math.round(value / step) * step;
      }

      function setStatus(text) {
        if (!els || !els.status) return;

        els.status.textContent = text || '';
        els.status.classList.toggle('visible', Boolean(text));
      }

      function showTemporaryStatus(text) {
        setStatus(text);

        setTimeout(() => {
          setStatus('');
        }, 2200);
      }

      function toDateStr(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');

        return `${y}-${m}-${d}`;
      }

      function addDays(isoDate, days) {
        const date = new Date(`${isoDate}T00:00:00`);
        date.setDate(date.getDate() + days);

        return toDateStr(date);
      }

      function formatDateRu(isoDate) {
        if (!isoDate) return '';

        const [y, m, d] = isoDate.split('-');

        return `${d}.${m}.${y}`;
      }

      function normalizeDate(value) {
        if (!value) return null;

        const str = String(value);

        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
          return str;
        }

        return null;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      function on(element, eventName, handler, options) {
        if (!element) {
          console.warn(`Умный садовод: не удалось навесить событие "${eventName}", элемент не найден.`);
          return;
        }

        element.addEventListener(eventName, handler, options);
      }
    })();
  </script>
